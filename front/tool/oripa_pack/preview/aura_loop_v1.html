<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>아우라 루프 v1 — 검은 스월 촉수 (승인용)</title>
<style>
  :root{--gold:#F3C64F}
  body{margin:0;background:#06080f;color:#c9d6e8;font:600 12px/-apple-system,'Apple SD Gothic Neo',sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
  h1{font-size:13px;margin:0;color:#8fa4c0}
  .stage{position:relative;width:400px;height:760px;background:radial-gradient(120% 90% at 50% 30%,#101a30 0%,#0a0f1e 55%,#06080f 100%);border-radius:22px;overflow:hidden}
  canvas{position:absolute;left:0;top:0}
  /* 카드 뒷면 (프리뷰 목업) */
  .card{position:absolute;left:50%;top:380px;width:215px;height:300px;transform:translate(-50%,-50%);
    background:linear-gradient(155deg,#232f47,#2c3a58 55%,#1e2942);border-radius:13px;
    box-shadow:inset 0 0 0 1.5px rgba(214,190,140,.5), inset 0 0 22px rgba(0,0,0,.45)}
  .card .inner{position:absolute;inset:9px;border:1px solid rgba(214,190,140,.35);border-radius:9px}
  .card .mark{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:86px;height:86px;border:1.5px solid rgba(214,190,140,.6);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--gold)}
  .card .wm{position:absolute;left:0;right:0;bottom:34px;text-align:center;letter-spacing:.35em;font-size:11px;color:rgba(201,214,232,.55)}
  .bar{display:flex;gap:6px}
  button{background:#101827;border:1px solid #263349;color:#c9d6e8;border-radius:9px;padding:7px 14px;font:700 12px inherit;cursor:pointer}
  button.on{border-color:var(--gold);color:var(--gold)}
  .lab{font-size:11px;color:#5c6f8a}
  .arm{position:absolute;left:0;top:0;background-size:100% 100%;pointer-events:none;
       filter:url(#smokewarp);will-change:transform,opacity}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <filter id="smokewarp" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.019" numOctaves="3" seed="7" result="n">
      <animate attributeName="baseFrequency" values="0.011 0.019;0.014 0.016;0.011 0.019" dur="13s" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<h1>아우라 루프 v1 — crisp gold rim + 보라 백라이트 + <b>검은 스월 촉수</b> (카드 뒤 전용)</h1>
<div class="stage">
  <canvas id="gl" width="400" height="760"></canvas>
  <canvas id="sp" width="400" height="760"></canvas>
  <div id="arms"></div>
  <div class="card"><div class="inner"></div><div class="mark">P</div><div class="wm">POKEFOLIO</div></div>
</div>
<div class="bar">
  <button id="bC">C</button><button id="bB">B</button><button id="bA">A</button>
  <button id="bS">S</button><button id="bSS" class="on">SS</button>
</div>
<div class="lab">URL: ?tier=ss&t=6000 (t 주면 정지). 공전 주기 12s — 검은 촉수가 좌우를 휘감으며 백라이트를 가림</div>
<script>
(() => {
  const W=400, H=760, CX=200, CY=380, HW=107.5, HH=150;
  const glc=document.getElementById('gl');
  const gl=glc.getContext('webgl',{alpha:true,premultipliedAlpha:true});
  const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const FS=`
precision highp float;
uniform float u_t,u_rimI,u_blI,u_dkI,u_spd,u_nT;
uniform vec3 u_rimC,u_blC;
uniform vec2 u_center,u_half;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);
 for(int i=0;i<4;i++){v+=a*noise(p);p=m*p;a*=.5;}return v;}
void main(){
 vec2 p=gl_FragCoord.xy-u_center;
 vec2 q2=abs(p)-(u_half-vec2(16.));
 float dR=length(max(q2,vec2(0.)))+min(max(q2.x,q2.y),0.)-16.;
 float dn=dR/u_half.x;
 if(dn<-.05||dn>1.8){gl_FragColor=vec4(0.);return;}
 float t=u_t, ang=atan(p.y,p.x);
 /* 1) 좁은 보라·청 백라이트 — 폭 좁게(감쇠 8), 강도 절제. 주인공 아님 */
 float asym=1.+.28*cos(ang-2.2)+.18*sin(2.*ang+.7);
 float nb=fbm(p*.008+vec2(0.,-t*.00018));
 float bl=exp(-max(dn,0.)*6.5)*u_blI*asym*(.85+.3*nb);
 vec3 C=u_blC*bl; float A=bl;
 /* 2) ★주인공: 검은 스월 팔 3~4개 — 카드 뒤에서 삐져나오는 굵고 불투명한 덩어리.
       궤도를 카드에 바짝(er .78~1.05), 두께 2배, 울퉁불퉁 결, 묵직한 공전 */
 vec2 e=vec2(p.x/(u_half.x*1.5), p.y/(u_half.y*1.14));
 float er=length(e), ea=atan(e.y,e.x);
 float rough=fbm(p*.02+vec2(t*.0001,-t*.00015));
 for(int i=0;i<4;i++){
  float fi=float(i);
  if(fi>=u_nT) break;
  float dirn = fi==2.? -1. : 1.;
  float sp=(.00048-fi*.00007)*u_spd;
  float Ai=fi*1.75+t*sp*dirn;
  float len=2.4+fi*.7;
  float ds=mod(dirn*(Ai-ea),6.2832);
  float s=ds/len;
  if(s<=1.){
   float rad=.84+fi*.08 - s*.05 + .06*sin(s*3.+t*.00035+fi*2.) + .05*(rough-.5);
   float dr=abs(er-rad) + .08*(fbm(vec2(ea*3.+fi*7., s*5.-t*.0004))-.5);
   float w=(.50-fi*.06)*(1.-s*.68);
   w*=1.+.30*sin(s*8.+fi*3.+t*.0005);
   float aT=1.-smoothstep(w*.55,w,dr);
   aT*=smoothstep(1.,.86,s)*smoothstep(-.02,.04,s);
   aT*=(.97-fi*.05)*u_dkI;
   vec3 dc = fi<2.? vec3(.035,.025,.055) : vec3(.085,.04,.13);
   C=dc*aT+C*(1.-aT); A=aT+A*(1.-aT);
   float eL=aT*(1.-aT)*3.2;                       /* 팔 윤곽 에지라이트 — 어두운 배경에서도 실루엣 읽힘 */
   C+=vec3(.45,.30,.78)*eL*.32*u_dkI; A=min(1.,A+eL*.18);
  }
 }
 /* 3) crisp 크림-금 림 — 카드에 딱 붙고 선명, 마지막에 얹음 */
 float rim=clamp(.016/max(dn,.005),0.,1.)*smoothstep(.5,.15,dn)*u_rimI;
 C=u_rimC*rim+C*(1.-rim); A=rim+A*(1.-rim);
 gl_FragColor=vec4(C,clamp(A,0.,1.));
}`;
  const mk=(ty,src)=>{const o=gl.createShader(ty);gl.shaderSource(o,src);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram();
  gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(pr); gl.useProgram(pr);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U={}; for (const u of ['u_t','u_rimI','u_blI','u_dkI','u_spd','u_nT','u_rimC','u_blC','u_center','u_half']) U[u]=gl.getUniformLocation(pr,u);
  gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA); gl.enable(gl.BLEND);
  gl.viewport(0,0,W,H);
  gl.uniform2f(U.u_center,CX,H-CY); gl.uniform2f(U.u_half,HW*1.03,HH*1.03);

  // 소량 스파크 (보조) — 캔버스 오버레이, 카드 뒤 레이어
  const sp=document.getElementById('sp').getContext('2d');
  const seed=(a=>()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296})(77);
  const SPK=Array.from({length:12},()=>({a:seed()*6.283,r:1.15+seed()*.6,sz:1+seed()*2,fq:400+seed()*900,ph:seed()*6.283}));

  // ══ 검은 스월 팔 — 기술 전환: 절차 셰이더 대신 "베이크드 텍스처 빌보드 + SVG 난류 변형" ══
  // 고품질 연기 팔을 오프스크린에 한 번 구워서(140개 블롭 누적) DOM 빌보드로 공전시킨다.
  const mkRnd=n=>{let a=n;return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};};
  function bakeArm(seedN,w,h,rgb,edge){
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d'); const r=mkRnd(seedN);
    for (let i=0;i<140;i++){
      const s=i/140;
      const px=w*.10 + s*w*.84;
      const py=h*.5 + Math.sin(s*4.6+seedN)*h*.15*(.3+s) + (r()-.5)*h*.07;
      const R=Math.max(2,(1-s*.72)*h*.30*(.65+.7*r()));
      const a=.16*(1-s*.45);
      const grd=g.createRadialGradient(px,py,0,px,py,R);
      grd.addColorStop(0,'rgba('+rgb+','+a+')');
      grd.addColorStop(.7,'rgba('+rgb+','+(a*.5)+')');
      grd.addColorStop(1,'rgba('+rgb+',0)');
      g.fillStyle=grd; g.beginPath(); g.arc(px,py,R,0,6.283); g.fill();
      if (r()<.25){                                   // 가장자리 보라 에지라이트 점
        const eR=R*.5, ey=py-(R*.6)*(r()<.5?1:-1);
        const eg=g.createRadialGradient(px,ey,0,px,ey,eR);
        eg.addColorStop(0,'rgba('+edge+','+(a*.5)+')'); eg.addColorStop(1,'rgba('+edge+',0)');
        g.fillStyle=eg; g.beginPath(); g.arc(px,ey,eR,0,6.283); g.fill();
      }
    }
    return c.toDataURL();
  }
  const armsEl=document.getElementById('arms');
  const ARM_DEFS=[
    {tex:bakeArm(11,360,170,'8,5,15','110,70,190'),  w:360,h:170,a0:.5, sp:.00040,dir:1, wrap:1.05,sc:1.15,fl:1},
    {tex:bakeArm(23,320,150,'15,8,26','130,80,210'), w:320,h:150,a0:2.5,sp:.00033,dir:1, wrap:.85, sc:1.0, fl:-1},
    {tex:bakeArm(37,380,160,'6,4,12','100,60,180'),  w:380,h:160,a0:4.0,sp:.00046,dir:-1,wrap:1.2, sc:1.28,fl:1},
    {tex:bakeArm(51,300,140,'19,10,32','140,90,220'),w:300,h:140,a0:5.4,sp:.00037,dir:1, wrap:.95, sc:.9,  fl:-1},
  ];
  const ARMS=ARM_DEFS.map(d=>{
    const el=document.createElement('div'); el.className='arm';
    el.style.width=d.w+'px'; el.style.height=d.h+'px';
    el.style.backgroundImage='url('+d.tex+')';
    el.style.transformOrigin='8% 50%';
    armsEl.appendChild(el);
    return Object.assign({el},d);
  });
  function updateArms(t,T){
    ARMS.forEach((a,i)=>{
      if (i>=T.nT || T.dkI<=0){ a.el.style.opacity=0; return; }
      const ang=a.a0 + t*a.sp*a.dir;
      const D=HW*.62 + 14*Math.sin(t*.0004+i*2.1);          // 머리가 카드 뒤에서 삐져나오는 거리
      const selfR=a.wrap + .10*Math.sin(t*.00045+i*1.7);    // 꼬리가 카드를 감아도는 각
      const sc=a.sc*(1+.04*Math.sin(t*.0006+i));
      a.el.style.opacity=Math.min(1,T.dkI*.96);
      a.el.style.left=CX+'px'; a.el.style.top=CY+'px';
      a.el.style.transform='translate(0,-50%) rotate('+ang+'rad) translateX('+D+'px) rotate('+selfR+'rad) scale('+sc+') scaleY('+a.fl+')';
    });
  }

  // 등급 프리셋 — C:없음 / B:실버·블루 / A:금+소량 연기 / S:보라·금+느린 스월 / SS:4색 최강 스월
  const TIERS={
    c:{rimI:.22,rimC:[.9,.93,1],   blI:0,  blC:[0,0,0],       dkI:0,  nT:0,spd:1},
    b:{rimI:.5, rimC:[.8,.9,1],    blI:.22,blC:[.42,.58,.95], dkI:0,  nT:0,spd:1},
    a:{rimI:.95,rimC:[1,.9,.68],   blI:.25,blC:[.85,.6,.28],  dkI:.55,nT:1,spd:.8},
    s:{rimI:1.05,rimC:[1,.93,.75], blI:.35,blC:[.6,.4,.95],   dkI:.8, nT:2,spd:.7},
    ss:{rimI:1.2,rimC:[1,.95,.8],  blI:.45,blC:[.53,.38,1],   dkI:1,  nT:4,spd:1},
  };
  const q=new URLSearchParams(location.search);
  let tier=TIERS[q.get('tier')]?q.get('tier'):'ss';
  const frozen=q.has('t'); const t0=frozen?+q.get('t'):0;
  const BTN={c:'bC',b:'bB',a:'bA',s:'bS',ss:'bSS'};
  for (const k in BTN) document.getElementById(BTN[k]).onclick=()=>{tier=k;
    for (const k2 in BTN) document.getElementById(BTN[k2]).classList.toggle('on',k2===k);};
  for (const k in BTN) document.getElementById(BTN[k]).classList.toggle('on',k===tier);

  function draw(t){
    const T=TIERS[tier];
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U.u_t,t); gl.uniform1f(U.u_rimI,T.rimI*(1+.05*Math.sin(t/650)));
    gl.uniform1f(U.u_blI,T.blI); gl.uniform1f(U.u_dkI,T.dkI);
    gl.uniform1f(U.u_spd,T.spd); gl.uniform1f(U.u_nT,0.);   // 셰이더 촉수 OFF — 팔은 DOM 빌보드가 담당
    gl.uniform3fv(U.u_rimC,T.rimC); gl.uniform3fv(U.u_blC,T.blC);
    gl.drawArrays(gl.TRIANGLES,0,3);
    updateArms(t,T);
    sp.clearRect(0,0,W,H);
    if (T.rimI>.3){
      for (const s2 of SPK){
        const tw=Math.max(0,Math.sin(t/s2.fq+s2.ph));
        if (tw<.25) continue;
        const x=CX+Math.cos(s2.a)*HW*s2.r*1.25, y=CY+Math.sin(s2.a)*HH*s2.r*1.08;
        sp.globalAlpha=tw*.7*Math.min(1,T.rimI);
        sp.fillStyle='#fff6dc';
        sp.beginPath(); sp.arc(x,y,s2.sz*(.5+.5*tw),0,6.283); sp.fill();
      }
      sp.globalAlpha=1;
    }
  }
  if (frozen){ draw(t0); }
  else { let st=null;
    requestAnimationFrame(function f(now){ if(st===null)st=now; draw(now-st); requestAnimationFrame(f); }); }
})();
</script></body></html>
