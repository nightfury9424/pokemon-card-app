<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>번호 오리파 · 리자몽 초고가</title>
<style>
  :root{
    --bg:#04080F; --surface:#0D1520; --surface2:#111C2B; --line:#1E2C3E;
    --blue:#1B64DA; --blue2:#2B7BF0; --text:#FFFFFF; --muted:#7A93B0; --gold:#FFCC00;
    --panAcell:#1A2A3C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#000; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--text); display:flex; align-items:center; justify-content:center;
    min-height:100%; overscroll-behavior:none;
  }
  /* Phone frame */
  #phone{
    position:relative; width:390px; height:844px; background:var(--bg);
    overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,.6);
    display:flex; flex-direction:column;
  }
  @media (max-width:420px){ #phone{ width:100vw; height:100vh; box-shadow:none; } }

  /* Header */
  #header{
    flex:0 0 auto; padding:14px 16px 12px; background:linear-gradient(180deg,#0A1220,#04080F);
    border-bottom:1px solid var(--line); z-index:5;
  }
  #header .title{ font-size:17px; font-weight:800; letter-spacing:-.3px; }
  #header .sub{ margin-top:4px; font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  #header .price{ color:var(--gold); font-weight:700; }
  #header .remain{ color:var(--text); font-weight:700; }
  #header .dot{ color:var(--line); }

  /* Scroll body — 상품판 only */
  #scroll{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:12px 12px 132px; }
  .sectionLabel{ font-size:12px; font-weight:800; color:#9FB4CC; margin:4px 2px 8px; display:flex; align-items:center; gap:6px; }
  .sectionLabel .hintTxt{ font-size:11px; font-weight:500; color:var(--muted); }

  /* 대표 상품 (horizontal) */
  #repRow{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 12px; margin-bottom:6px; }
  .repCard{ position:relative; flex:0 0 auto; width:118px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:9px; }
  .repCard.hi{ border-color:rgba(255,204,0,.5); }
  .repCard .rbadge{ position:absolute; top:7px; left:7px; font-size:10px; font-weight:800; background:rgba(4,8,15,.8); color:var(--gold); border:1px solid rgba(255,204,0,.4); padding:1px 7px; border-radius:10px; }
  .repCard .rpimg{ width:100%; height:118px; border-radius:7px; background:#0A1220; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:7px; }
  .repCard .rpimg img{ width:100%; height:100%; object-fit:contain; }
  .repCard .rpname{ font-size:11.5px; font-weight:700; line-height:1.25; height:29px; overflow:hidden; }
  .repCard .rpprice{ margin-top:4px; font-size:12px; font-weight:800; color:var(--gold); }

  /* 전체 상품 grid (transparency) */
  #allGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .pcell{
    position:relative; background:var(--panAcell); border:1px solid var(--line); border-radius:9px;
    padding:5px 4px 6px; display:flex; flex-direction:column; align-items:center; min-height:104px;
    transition:transform .4s cubic-bezier(.2,.8,.25,1), box-shadow .4s, border-color .3s;
  }
  .pcell .pnum{ font-size:11px; font-weight:800; color:#9FB4CC; }
  .pcell .pimg{ width:100%; height:60px; margin:3px 0; border-radius:5px; background:#0A1220 center/cover no-repeat; display:flex; align-items:center; justify-content:center; }
  .pcell .pimg img{ height:100%; width:auto; max-width:100%; object-fit:contain; }
  .pcell .pprice{ font-size:10.5px; font-weight:700; color:var(--gold); }
  .pcell.hi{ border-color:rgba(255,204,0,.55); box-shadow:0 0 0 1px rgba(255,204,0,.25) inset; }
  .pcell.hi .pnum{ color:var(--gold); }
  .pcell.taken{ background:transparent; border-style:dashed; border-color:#233448; }
  .pcell.taken .pimg,.pcell.taken .pprice{ visibility:hidden; }
  .pcell.taken::after{ content:"획득 완료"; position:absolute; top:50%; left:0; right:0; transform:translateY(-30%); text-align:center; font-size:10px; color:#3E5470; }
  .pcell.taken .pnum{ color:#3E5470; }
  /* auto-focus of matched number, resolved product brought forward */
  .pcell.focus{ transform:scale(1.14); z-index:4; border-color:var(--blue2); box-shadow:0 10px 26px rgba(0,0,0,.65); }
  .pcell.focus.hivalue{ border-color:rgba(255,204,0,.75); box-shadow:0 10px 30px rgba(255,204,0,.28); }

  /* Bottom draw bar (fixed) */
  #drawBar{
    position:absolute; left:0; right:0; bottom:0; padding:9px 12px 12px;
    background:rgba(6,11,20,.96); border-top:1px solid var(--line); z-index:8; backdrop-filter:blur(6px);
  }
  #drawBar .demoRow{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #drawBar .demoRow label{ font-size:11px; color:var(--muted); white-space:nowrap; }
  #demoSel{ flex:1; background:var(--surface2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:12px; }
  #drawBtn{ width:100%; background:var(--blue); color:#fff; border:none; border-radius:12px; padding:15px; font-size:16px; font-weight:800; cursor:pointer; }
  #drawBtn:active{ background:#1550B8; }
  #drawBtn:disabled{ background:#22344A; color:#4E6580; }

  /* Overlay base */
  .overlay{ position:absolute; inset:0; background:rgba(3,7,14,.97); display:none; flex-direction:column; z-index:20; }
  .overlay.show{ display:flex; }

  /* Pull motion (physical deck stir + one pulled) */
  #pullView{ align-items:center; justify-content:center; }
  #pullView .plabel{ position:absolute; top:96px; left:0; right:0; text-align:center; font-size:14px; color:var(--muted); }
  .deckWrap{ position:relative; width:170px; height:230px; }
  .backSkin{
    border-radius:12px; border:1px solid #2A4A6C; background-color:#12233B;
    background-image:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.05), transparent 55%),
      repeating-linear-gradient(45deg,#12233B 0,#12233B 9px,#0F1E33 9px,#0F1E33 18px);
  }
  .deck{
    position:absolute; left:50%; top:50%; width:150px; height:210px; margin:-105px 0 0 -75px;
    box-shadow:3px 3px 0 #0e1c30, 6px 6px 0 #0c1828, 9px 9px 0 #0a1524, 0 16px 30px rgba(0,0,0,.5);
  }
  .deck::after{ content:"오리파"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:#3F6796; }
  .deck.stir{ animation:stir .66s ease-in-out; }
  @keyframes stir{
    0%{ transform:rotate(0) translate(0,0); }
    18%{ transform:rotate(-2.6deg) translate(-4px,1px); }
    40%{ transform:rotate(2.2deg) translate(5px,-1px); }
    64%{ transform:rotate(-1.6deg) translate(-3px,2px); }
    84%{ transform:rotate(1deg) translate(2px,0); }
    100%{ transform:rotate(0) translate(0,0); }
  }
  .drawcard{
    position:absolute; left:50%; top:50%; width:150px; height:210px; margin:-105px 0 0 -75px;
    opacity:0; z-index:5; box-shadow:0 12px 26px rgba(0,0,0,.55);
    transform:translate(0,0) scale(1);
    transition:transform .4s cubic-bezier(.2,.8,.25,1), opacity .18s ease;
  }
  .drawcard.pulled{ opacity:1; transform:translate(0,152px) scale(1.06); }

  /* Slide (cover) view — user-driven, UNCHANGED physics */
  #slideView{ align-items:center; justify-content:center; }
  #slideView .hint{ position:absolute; top:70px; left:0; right:0; text-align:center; font-size:14px; color:var(--muted); padding:0 30px; line-height:1.5; transition:opacity .3s; }
  .stack{ position:relative; width:236px; height:328px; touch-action:none; }
  .card{ position:absolute; inset:0; border-radius:14px; overflow:hidden; }
  .filler{ background:#0E1725; border:1px solid #223145; display:flex; align-items:center; justify-content:center; }
  .filler .fimg{ width:100%; height:100%; object-fit:cover; opacity:.9; }
  .sticker{
    position:absolute; top:34%; left:50%; transform:translate(-50%,-50%) rotate(-3deg);
    background:#FDFDF6; color:#0A1220; border-radius:6px; padding:8px 16px; min-width:96px; text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.5); border:1px solid #E4E2D2;
  }
  .sticker .slabel{ font-size:9px; font-weight:700; color:#8A8672; letter-spacing:1px; }
  .sticker .snum{ font-size:34px; font-weight:900; line-height:1; letter-spacing:-1px; }
  .cover{
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.06), transparent 55%),
      repeating-linear-gradient(45deg,#12233B 0,#12233B 9px,#0F1E33 9px,#0F1E33 18px);
    background-color:#12233B; border:1px solid #2A4A6C;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:grab; will-change:transform;
  }
  .cover:active{ cursor:grabbing; }
  .cover .cmark{ font-size:26px; font-weight:900; color:#3F6796; text-align:center; line-height:1.15; }
  .cover .ctxt{ margin-top:8px; font-size:11px; color:#4E76A0; letter-spacing:1px; }
  .cover .arrow{ margin-top:14px; font-size:20px; color:#3F6796; animation:bob 1.3s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
  #slideView .track{ position:absolute; bottom:80px; left:40px; right:40px; height:4px; background:var(--line); border-radius:3px; }
  #slideView .track .fill{ height:100%; width:0%; background:var(--blue2); border-radius:3px; }

  /* Result bar (in-place on 상품판) */
  #resultBar{
    position:absolute; left:0; right:0; bottom:0; padding:12px; z-index:9;
    background:rgba(6,11,20,.98); border-top:1px solid var(--line); backdrop-filter:blur(6px);
    display:none;
  }
  #resultBar.show{ display:block; }
  #resultBar .rConfirm{ font-size:15px; font-weight:800; text-align:center; margin-bottom:3px; }
  #resultBar .rConfirm.hi{ color:var(--gold); }
  #resultBar .rHi{ display:none; text-align:center; font-size:11px; font-weight:700; color:var(--gold); letter-spacing:.5px; margin-bottom:9px; }
  #resultBar.hivalue .rHi{ display:block; }
  #resultBar .rSub{ text-align:center; font-size:11px; color:var(--muted); margin-bottom:11px; }
  #resultBar .rBtns{ display:flex; gap:8px; }
  #resultBar .rBtns button{ flex:1; border-radius:11px; padding:13px; font-size:14px; font-weight:800; cursor:pointer; border:1px solid var(--line); }
  #keepBtn{ background:var(--surface2); color:var(--text); }
  #keepBtn:active{ background:#0A1420; }
  #swapBtn{ background:var(--blue); color:#fff; border-color:var(--blue); }
  #swapBtn:active{ background:#1550B8; }
  #againBtn{ margin-top:9px; width:100%; background:transparent; border:none; color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; padding:6px; }
</style>
</head>
<body>
<div id="phone">
  <div id="header">
    <div class="title">리자몽 초고가 오리파</div>
    <div class="sub">
      <span class="price">1구 50,000P</span><span class="dot">·</span>
      <span>남은 <span class="remain" id="remainCount">--</span>/100</span>
    </div>
  </div>

  <!-- 상품판 (전시판) — transparency is the essence -->
  <div id="scroll">
    <div class="sectionLabel">대표 상품 <span class="hintTxt">아직 안 나간 고가 상품</span></div>
    <div id="repRow"></div>

    <div class="sectionLabel">전체 상품 · 번호별 <span class="hintTxt">번호마다 어떤 상품인지 그대로 공개</span></div>
    <div id="allGrid"></div>
  </div>

  <!-- Bottom draw bar -->
  <div id="drawBar">
    <div class="demoRow">
      <label>데모: 결과 지정</label>
      <select id="demoSel"><option value="">랜덤 (실제와 동일)</option></select>
    </div>
    <button id="drawBtn">1구 뽑기 · 50,000P</button>
  </div>

  <!-- Physical pull motion -->
  <div class="overlay" id="pullView">
    <div class="plabel">봉인 카드를 한 장 뽑는 중…</div>
    <div class="deckWrap">
      <div class="deck backSkin" id="deck"></div>
      <div class="drawcard backSkin" id="drawcard"></div>
    </div>
  </div>

  <!-- User-driven cover-slide (kept as-is) -->
  <div class="overlay" id="slideView">
    <div class="hint" id="slideHint">봉인 카드가 손에 왔습니다.<br>위 커버를 손가락으로 <b>아래로 밀어</b> 번호를 확인하세요.</div>
    <div class="stack" id="stack">
      <div class="card filler" id="filler">
        <img class="fimg" id="fillerImg" alt="">
        <div class="sticker" id="sticker">
          <div class="slabel">NO.</div>
          <div class="snum" id="stickerNum">--</div>
        </div>
      </div>
      <div class="card cover" id="cover">
        <div class="cmark">번호<br>오리파</div>
        <div class="ctxt">SEALED</div>
        <div class="arrow">▾</div>
      </div>
    </div>
    <div class="track"><div class="fill" id="slideFill"></div></div>
  </div>

  <!-- Result bar (focus is in the 상품판 grid itself) -->
  <div id="resultBar">
    <div class="rConfirm" id="rConfirm"></div>
    <div class="rHi">고가 상품 · 오늘의 큰 건</div>
    <div class="rSub" id="rSub">상품판의 해당 번호를 확인하세요</div>
    <div class="rBtns">
      <button id="keepBtn">보관하기</button>
      <button id="swapBtn">교환</button>
    </div>
    <button id="againBtn">다시 뽑기</button>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var imgUrl = function(c){ return CDN + "/" + c.img + "/" + c.id + ".png"; };
  var won = function(p){ return p.toLocaleString("ko-KR") + "원"; };
  var pts = function(p){ return p.toLocaleString("ko-KR") + "P"; };
  var HIVALUE = 300000; // 고가 emphasis threshold

  // ---- Build the 100-number 상품판 ----
  var priced = CARDS.filter(function(c){ return c.price > 0; });
  var byPrice = priced.slice().sort(function(a,b){ return b.price - a.price; });
  var hits   = byPrice.filter(function(c){ return c.price >= HIVALUE; });
  var mids   = byPrice.filter(function(c){ return c.price >= 25000 && c.price < HIVALUE; });
  var cheaps = byPrice.filter(function(c){ return c.price < 6000; });

  function pick(arr, n){
    var pool = arr.slice(), out = [];
    for(var i=0;i<n && pool.length;i++){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    return out;
  }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // realistic spread: 6 hits + 16 mids + 78 fillers
  var chosen = pick(hits,6).concat(pick(mids,16)).concat(pick(cheaps,78));
  while(chosen.length < 100){ chosen.push(cheaps[Math.floor(Math.random()*cheaps.length)]); }
  chosen = shuffle(chosen).slice(0,100);

  var products = chosen.map(function(c,i){
    return { number:i+1, card:c, taken:false, hi:(c.price >= HIVALUE) };
  });

  // pre-consume so entry already shows empties (남은 63/100)
  shuffle(products.map(function(p){return p.number;})).slice(0,37).forEach(function(n){ products[n-1].taken = true; });

  function remainingNumbers(){ return products.filter(function(p){ return !p.taken; }).map(function(p){ return p.number; }); }

  // ---- DOM refs ----
  var $ = function(id){ return document.getElementById(id); };
  var scroll=$("scroll"), repRow=$("repRow"), allGrid=$("allGrid"), remainCount=$("remainCount");
  var demoSel=$("demoSel"), drawBtn=$("drawBtn"), drawBar=$("drawBar");
  var pullView=$("pullView"), deck=$("deck"), drawcard=$("drawcard");
  var slideView=$("slideView"), stack=$("stack"), cover=$("cover");
  var fillerImg=$("fillerImg"), sticker=$("sticker"), stickerNum=$("stickerNum");
  var slideHint=$("slideHint"), slideFill=$("slideFill");
  var resultBar=$("resultBar"), rConfirm=$("rConfirm"), rSub=$("rSub"), swapBtn=$("swapBtn");

  // ---- Render 대표 상품 (top remaining by price) ----
  function renderRep(){
    repRow.innerHTML = "";
    var reps = products.filter(function(p){ return !p.taken; })
                       .sort(function(a,b){ return b.card.price - a.card.price; })
                       .slice(0,4);
    reps.forEach(function(p){
      var d = document.createElement("div");
      d.className = "repCard" + (p.hi?" hi":"");
      d.innerHTML =
        '<div class="rbadge">'+p.number+'번</div>'+
        '<div class="rpimg"><img src="'+imgUrl(p.card)+'" alt="" onerror="this.style.display=\'none\'"></div>'+
        '<div class="rpname">'+p.card.name+'</div>'+
        '<div class="rpprice">'+won(p.card.price)+'</div>';
      repRow.appendChild(d);
    });
  }

  // ---- Render 전체 상품 grid (numbered, taken dimmed) ----
  function renderAll(){
    allGrid.innerHTML = "";
    products.forEach(function(p){
      var d = document.createElement("div");
      d.className = "pcell" + (p.hi?" hi":"") + (p.taken?" taken":"");
      d.dataset.num = p.number;
      var img = p.taken ? "" : '<img src="'+imgUrl(p.card)+'" alt="" onerror="this.style.display=\'none\'">';
      d.innerHTML =
        '<div class="pnum">'+p.number+'</div>'+
        '<div class="pimg">'+img+'</div>'+
        '<div class="pprice">'+won(p.card.price)+'</div>';
      allGrid.appendChild(d);
    });
  }

  function refreshRemain(){
    var n = remainingNumbers().length;
    remainCount.textContent = n;
    drawBtn.disabled = (n === 0);
  }

  // ---- Demo forcing control (feeds the automatic pull) ----
  function rebuildDemoSelect(){
    var keep = demoSel.value;
    demoSel.innerHTML = '<option value="">랜덤 (실제와 동일)</option>';
    remainingNumbers().sort(function(a,b){return a-b;}).forEach(function(n){
      var p = products[n-1];
      var o = document.createElement("option");
      o.value = n;
      o.textContent = n + "번 · " + p.card.name + " (" + won(p.card.price) + ")";
      demoSel.appendChild(o);
    });
    if([].slice.call(demoSel.options).some(function(o){return o.value===keep;})) demoSel.value = keep;
  }

  // ---- Press [1구 뽑기]: result decided NOW, then physical pull presents it ----
  var pending = null; // { number }
  drawBtn.addEventListener("click", function(){
    var rem = remainingNumbers();
    if(!rem.length) return;
    var forced = demoSel.value ? parseInt(demoSel.value,10) : null;
    var number = (forced && rem.indexOf(forced)>=0) ? forced : rem[Math.floor(Math.random()*rem.length)];
    pending = { number:number };
    playPull(number);
  });

  // ---- Automatic physical pull: deck stir + one sealed item slides forward ----
  function playPull(number){
    deck.classList.remove("stir");
    drawcard.classList.remove("pulled");
    pullView.classList.add("show");
    void deck.offsetWidth; // reflow so animation restarts
    deck.classList.add("stir");
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
    // after the stir settles, one item slides forward and rests in front
    setTimeout(function(){ drawcard.classList.add("pulled"); if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){} }, 640);
    // hand the pulled item to the user-driven cover-slide
    setTimeout(function(){ pullView.classList.remove("show"); openSlide(number); }, 1120);
  }

  // ---- Slide / cover reveal (UNCHANGED physics: finger-follow, resistance, spring-back) ----
  var MAX = 300;      // px the cover travels downward
  var STICK = 0.30;   // release threshold
  var pos = 0, dragging=false, startY=0, done=false;

  function tick(){ if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){} }

  function openSlide(number){
    var filler = cheaps[Math.floor(Math.random()*cheaps.length)] || CARDS[0];
    fillerImg.src = imgUrl(filler);
    stickerNum.textContent = number;
    pos = 0; done = false;
    cover.style.transition = "none";
    cover.style.transform = "translateY(0px)";
    slideFill.style.width = "0%";
    slideHint.style.opacity = "1";
    slideView.classList.add("show");
  }

  function setPos(px){
    pos = Math.max(0, Math.min(MAX, px));
    cover.style.transform = "translateY(" + pos + "px)";
    var prog = pos / MAX;
    slideFill.style.width = (prog*100).toFixed(1) + "%";
    if(prog > 0.05) slideHint.style.opacity = "0";
  }

  var lastTickBucket = -1;
  cover.addEventListener("pointerdown", function(e){
    if(done) return;
    dragging = true; startY = e.clientY - pos;
    cover.style.transition = "none";
    cover.setPointerCapture(e.pointerId);
  });
  cover.addEventListener("pointermove", function(e){
    if(!dragging || done) return;
    var dy = (e.clientY - startY) * 0.92; // mild resistance; moves with finger
    setPos(dy);
    var bucket = Math.floor((pos/MAX)*12);
    if(bucket !== lastTickBucket){ lastTickBucket = bucket; tick(); }
  });
  function endDrag(){
    if(!dragging || done) return;
    dragging = false;
    cover.style.transition = "transform .32s cubic-bezier(.2,.8,.25,1)";
    var prog = pos / MAX;
    if(prog < STICK){
      setPos(0); // spring back up
    } else {
      done = true;
      setPos(MAX);
      slideFill.style.width = "100%";
      if(navigator.vibrate) try{ navigator.vibrate([10,40,18]); }catch(err){}
      setTimeout(goResult, 640);
    }
  }
  cover.addEventListener("pointerup", endDrag);
  cover.addEventListener("pointercancel", endDrag);

  // ---- Return to 상품판, auto-focus matching number ----
  function goResult(){
    var number = pending.number;
    var p = products[number-1];
    slideView.classList.remove("show");

    // product not yet consumed — it renders normally, then we bring it forward
    renderRep(); renderAll();
    var cell = allGrid.querySelector('.pcell[data-num="'+number+'"]');
    if(cell){
      cell.classList.add("focus"); if(p.hi) cell.classList.add("hivalue");
      cell.scrollIntoView({ block:"center" });
    }

    rConfirm.textContent = number + "번 상품입니다 · " + p.card.name;
    rConfirm.className = "rConfirm" + (p.hi?" hi":"");
    rSub.textContent = won(p.card.price) + " 상당";
    swapBtn.textContent = pts(p.card.price) + "로 교환";
    resultBar.className = "resultBar show" + (p.hi?" hivalue":"");
    resultBar.classList.add("show"); if(p.hi) resultBar.classList.add("hivalue");
    drawBar.style.display = "none";
  }

  // ---- Finalize: 이 상품은 획득 완료 → 상품판에서 빠지고 남은 -1 ----
  function finalize(){
    if(!pending) return;
    products[pending.number-1].taken = true;
    pending = null;
    resultBar.classList.remove("show","hivalue");
    drawBar.style.display = "";
    renderRep(); renderAll(); refreshRemain(); rebuildDemoSelect();
    scroll.scrollTop = 0;
  }
  $("keepBtn").addEventListener("click", finalize);
  $("swapBtn").addEventListener("click", finalize);
  $("againBtn").addEventListener("click", finalize);

  // ---- Init ----
  renderRep(); renderAll(); refreshRemain(); rebuildDemoSelect();
})();
</script>
</body>
</html>
