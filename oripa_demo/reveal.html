<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>oripa — REVEAL 데모</title>
<style>
/* ============================================================
   oripa REVEAL 데모 — 두 오리파 타입 (공유: 봉인판 → 픽 → 표지 내리기)
   ● 비공개형(Closed): 표지 아래 = 실제 상품 카드 직접. 번호/결과판 없음.
   ● 오픈형(Open): 표지 아래 = 필러 카드 + 번호 스티커. 번호가 FACE-UP 전시판
     (상품 전량 공개 + 뽑힌 자리 검은 빈칸)의 셀로 모프 → 셀에서 상품이 들려 나옴.
   공유 물리: 표지 내리기(마찰/드리프트/지연/미세스틱/접촉그림자) + 봉인판 겹친카드 룩.
   ★ 티어 힌트(글로우/암전)는 최종 공개 순간에만. 표지/봉인판엔 전조 없음.
   디자인 기준 390×844 (모바일 퍼스트), 데스크톱은 폰 스테이지 센터링
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#010203;
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  color:var(--txt);
  overflow:hidden;
}
:root{
  --bg:#04080F;
  --txt:#E8EEF7;
  --sub:#8B98AC;
  --surf:#101826;
  --surfEl:#1A2436;
  --line:rgba(255,255,255,.08);
  --accent:#4D8FEA;      /* 테마 포인트 (다크 프리즘 = 블루) */
  --accent2:#9D5CFF;     /* 보조 (바이올렛) */
  --tier:#E8EEF7;        /* 현재 추첨 티어 색 — JS 주입, 최종 공개 전까지 미노출 */
}
#stage[data-theme="flame"]{
  --accent:#FF6B35;      /* 화염 스킨 — 엠버 오렌지 */
  --accent2:#FFB35C;
}

/* ---------- 스테이지 (폰 프레임) ---------- */
#stage{
  position:relative;
  width:min(100vw,390px);
  height:min(100dvh,844px);
  background:var(--bg);
  overflow:hidden;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
}
@media (min-width:500px) and (min-height:900px){
  #stage{border-radius:38px;box-shadow:0 0 0 8px #14181f,0 30px 90px rgba(0,0,0,.8)}
}
#vignette{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(120% 90% at 50% 38%, transparent 40%, rgba(0,0,0,.55) 100%),
    radial-gradient(80% 55% at 50% 30%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%);
}

/* ---------- 모드 토글 (상단, 데모용) ---------- */
#modeToggle{
  position:absolute;top:calc(11px + env(safe-area-inset-top));left:14px;z-index:52;
  display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;
  padding:2px;backdrop-filter:blur(6px);
}
#modeToggle button{
  border:0;background:transparent;color:var(--sub);
  font-size:11px;font-weight:800;padding:5px 11px;border-radius:99px;cursor:pointer;letter-spacing:.02em;
}
#modeToggle button.on{background:var(--txt);color:#04080F}

/* ---------- 상단 진행 dot 1-2-3 ---------- */
#dots{
  position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:20;
  display:flex;justify-content:center;gap:22px;pointer-events:none;
  opacity:0;transition:opacity .4s;
}
#dots.show{opacity:1}
#dots .dot{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--sub);
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  transition:all .35s;
}
#dots .dot.on{color:#04080F;background:var(--txt);border-color:var(--txt);box-shadow:0 0 14px rgba(232,238,247,.5)}
#dots .dot.past{color:var(--txt);border-color:rgba(232,238,247,.4)}

/* ---------- 스킵 버튼 ---------- */
#skipBtn{
  position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:50;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--sub);
  font-size:12px;padding:7px 13px;border-radius:99px;cursor:pointer;
  backdrop-filter:blur(4px);display:none;
}
#skipBtn.show{display:block}
#skipBtn:active{background:rgba(255,255,255,.12)}

/* ---------- 티어 글로우 (최종 공개 순간에만 등장) ---------- */
#glow{
  position:absolute;left:50%;top:44%;z-index:16;pointer-events:none;
  width:420px;height:520px;transform:translate(-50%,-50%);
  background:radial-gradient(50% 50% at 50% 50%, var(--tier), transparent 70%);
  opacity:0;transition:opacity .3s;will-change:opacity;
  filter:blur(6px);
}

/* ============================================================
   보드 공통 (봉인판 / 오픈 전시판)
   ============================================================ */
.board{
  position:absolute;inset:0;z-index:15;background:var(--bg);
  display:none;flex-direction:column;
  padding:calc(44px + env(safe-area-inset-top)) 14px 0;
  overflow:hidden;
}
.board.show{display:flex}
.bTitle{font-size:19px;font-weight:900;letter-spacing:.01em;margin-bottom:6px}
.bMeta{display:flex;align-items:baseline;gap:10px;font-size:12px;color:var(--sub);margin-bottom:7px}
.bMeta b{font-size:14px;color:var(--accent);font-weight:900}
.gauge{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:10px;flex:none}
.gauge i{display:block;height:100%;border-radius:3px;width:73%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s;}
#lineup{display:flex;gap:8px;margin-bottom:12px}
#lineup .lu{
  flex:1;display:flex;align-items:center;gap:7px;
  background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:5px 7px;min-width:0;
}
#lineup .lu img{width:30px;height:42px;object-fit:cover;border-radius:3px;flex:none;background:#0B1220}
#lineup .lu .li{min-width:0}
#lineup .lu .ln{font-size:9px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lineup .lu .lp{font-size:9px;color:#FFCC00;font-weight:800}
.bGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}

/* --- 봉인판 셀 = 겹친 카드 오브젝트 (공유 픽 화면) --- */
.mpack{aspect-ratio:63/88;position:relative;cursor:pointer}
.mpack:not(.gone)::before{
  content:"";position:absolute;inset:0;border-radius:3px;
  transform:translate(1.4px,1.9px) rotate(calc(var(--jit,0deg) * -0.55));
  background:linear-gradient(160deg,#121A28,#060A12);
  box-shadow:0 2px 4px rgba(0,0,0,.5);
}
.mpack .stk{
  position:absolute;inset:0;border-radius:3px;overflow:hidden;
  transform:rotate(var(--jit,0deg));
  background:
    radial-gradient(62% 44% at 50% 34%, rgba(255,255,255,.05), transparent 72%),
    linear-gradient(160deg,#1E2839,#0C121F 55%,#182134);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 2px 5px rgba(0,0,0,.55), inset 1px 1px 0 rgba(255,255,255,.06), inset -1px -1px 0 rgba(0,0,0,.35);
  transition:transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s;
  will-change:transform;
}
.mpack .stk::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.09) 50%,transparent 56%);
  background-size:230% 230%;
  animation:mSheen 3.6s linear var(--d,0s) infinite;
}
@keyframes mSheen{0%{background-position:160% 0}55%{background-position:-60% 0}100%{background-position:-60% 0}}
.mpack .stk::before{
  content:"";position:absolute;top:1px;bottom:1px;right:0;width:1.5px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.35));
}
.mpack.gone{cursor:default}
.mpack.gone::after{
  content:"";position:absolute;inset:0;border-radius:3px;
  background:radial-gradient(120% 120% at 50% 32%, rgba(0,0,0,.55), rgba(0,0,0,.18));
  box-shadow:inset 0 2px 4px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.03);
}
.mpack.sel{z-index:3}
.mpack.sel .stk{
  transform:rotate(var(--jit,0deg)) translateY(-3px) scale(1.07);
  box-shadow:0 9px 17px rgba(0,0,0,.6), 0 0 12px color-mix(in srgb,var(--accent) 45%,transparent), inset 1px 1px 0 rgba(255,255,255,.09);
  border-color:var(--accent);
}
#gridA.picking .mpack:not(.sel):not(.gone) .stk{opacity:.5;transition:opacity .2s}

/* --- 오픈 전시판 셀 = FACE-UP 실제 상품 + 번호 / 뽑힘 = 검은 빈칸 --- */
.ocell{aspect-ratio:63/88;position:relative;border-radius:4px;overflow:hidden;
  background:#0B1220;border:1px solid rgba(255,255,255,.08)}
.ocell img{width:100%;height:100%;object-fit:cover;display:block}
.ocell .ntag{position:absolute;top:1px;left:3px;font-size:7px;font-weight:800;color:rgba(255,255,255,.9);text-shadow:0 1px 2px #000}
.ocell.gap{background:radial-gradient(120% 120% at 50% 28%, #000, #04060B);
  border:1px solid rgba(255,255,255,.05);box-shadow:inset 0 2px 7px rgba(0,0,0,.85)}
.ocell.gap img,.ocell.gap .ntag{display:none}
.ocell.mine{border-color:rgba(232,238,247,.9);z-index:2;animation:cellPulse 1s ease-in-out infinite}
@keyframes cellPulse{0%,100%{box-shadow:0 0 4px rgba(232,238,247,.45)}50%{box-shadow:0 0 17px rgba(232,238,247,.95)}}

/* 확정 바 (봉인판 픽) */
#confirmBar{
  position:absolute;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:65;padding:10px 14px;
  transform:translateY(140%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
}
#confirmBar.show{transform:translateY(0)}
/* 오픈 전시판 → 뽑기 진입 바 */
#openDrawBar{
  position:absolute;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:64;padding:10px 14px;
  transform:translateY(140%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
}
#openDrawBar.show{transform:translateY(0)}
#confirmBtn,#openDrawBtn{
  width:100%;border:0;border-radius:14px;padding:15px 0;font-size:15px;font-weight:800;cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 45%,transparent);
}
#confirmBtn:active,#openDrawBtn:active{transform:scale(.98)}
/* 고른 카드 → 센터로 날아가 스택으로 확대되는 클론 (티어 무관 동일) */
#flyPack{
  position:absolute;left:0;top:0;width:264px;height:369px;border-radius:14px;z-index:25;
  background:
    radial-gradient(58% 42% at 50% 36%, rgba(255,255,255,.05), transparent 70%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 10px),
    linear-gradient(160deg,#1E2839,#0C121F 55%,#182134);
  border:1px solid rgba(255,255,255,.10);box-shadow:0 14px 40px rgba(0,0,0,.65);
  transform-origin:0 0;will-change:transform;
  transition:transform .55s cubic-bezier(.25,.8,.3,1);pointer-events:none;
}

/* ============================================================
   까기: 카드 스택 (표지 + 아래 카드)
   ============================================================ */
#packWrap{
  position:absolute;left:50%;top:44%;z-index:18;
  transform:translate(-50%,-50%);will-change:transform,opacity;
}
#packWrap.shake{animation:shake .14s linear}
@keyframes shake{
  0%{transform:translate(calc(-50% - 2px),-50%)}
  50%{transform:translate(calc(-50% + 2px),calc(-50% + 1px))}
  100%{transform:translate(-50%,-50%)}
}
#pack{position:relative;width:264px;height:369px;opacity:0;will-change:transform,opacity}
#pack.settle{animation:packSettle .3s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes packSettle{
  0%{opacity:1;transform:scale(1.03)}
  60%{opacity:1;transform:scale(.995)}
  100%{opacity:1;transform:scale(1)}
}
/* BOTTOM: 아래 카드 (오픈=필러+스티커 / 비공개=실상품) */
#resultCard{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;
  transform:rotate(-.35deg);background:#0B1220;box-shadow:0 16px 44px rgba(0,0,0,.6);will-change:transform;
}
#resultCard img{width:100%;height:100%;object-fit:cover;display:block}
#resultCard .gloss{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);
  background-size:250% 250%;animation:glossSweep 2.1s ease-in-out infinite;will-change:background-position;
}
@keyframes glossSweep{0%{background-position:140% 0}55%{background-position:-40% 0}100%{background-position:-40% 0}}
/* 흰 번호 스티커 (오픈형 전용) — 값싼 아날로그 가격표 (찌그러진 타원 + 프린트 오프셋) */
#resultCard .sticker{
  position:absolute;left:50%;top:84px;width:56px;height:50px;margin-left:-27px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #FFFFFF, #EFEDE4 82%);
  transform:rotate(-3deg);
  box-shadow:0 2px 6px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.06), inset 0 -2px 4px rgba(0,0,0,.09);
  color:#1B222E;pointer-events:none;
}
#resultCard .sticker span{position:absolute;left:10px;top:8px;font-size:6.5px;font-weight:700;letter-spacing:.06em;color:#A7ADB8}
#resultCard .sticker b{
  position:absolute;left:50%;top:50%;transform:translate(calc(-50% + 1.5px),calc(-50% + 1px)) rotate(-1.5deg);
  font-size:23px;font-weight:900;line-height:1;font-family:"Marker Felt","Bradley Hand","Segoe Print",cursive;
}
#resultCard .sticker.pulse{animation:stickerPulse .6s cubic-bezier(.3,.7,.4,1)}
@keyframes stickerPulse{
  0%{transform:rotate(-3deg) scale(1)}
  35%{transform:rotate(-3deg) scale(1.32);box-shadow:0 4px 14px rgba(0,0,0,.55),0 0 20px rgba(255,255,255,.85)}
  100%{transform:rotate(-3deg) scale(1)}
}
/* 표지가 아래 카드에 드리우는 이동 그림자 + 리빌 라인 (표지와 함께 내려감) */
#revealEdge{
  position:absolute;left:0;right:0;top:-22px;height:22px;pointer-events:none;
  background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.15) 55%, transparent);
  border-bottom:1px solid rgba(255,255,255,.5);box-shadow:0 3px 7px rgba(0,0,0,.4);
  opacity:0;will-change:transform,opacity;
}
/* TOP: 표지 카드 (오리파 카드백 — 티어 무관 100% 동일) */
#coverCard{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;z-index:5;
  transform:translate(2px,0) rotate(1deg);
  background:
    radial-gradient(58% 42% at 50% 36%, rgba(255,255,255,.045), transparent 70%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 10px),
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 12px),
    linear-gradient(160deg,#1E2839,#0C121F 55%,#182134);
  border:1px solid rgba(255,255,255,.10);box-shadow:0 8px 24px rgba(0,0,0,.6);
  will-change:transform,opacity;cursor:grab;
}
#coverCard:active{cursor:grabbing}
#coverCard::before{content:"";position:absolute;inset:9px;border-radius:8px;border:1px solid rgba(255,255,255,.12);pointer-events:none}
#coverCard::after{content:"";position:absolute;inset:-40%;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.07) 50%,transparent 58%)}
#coverCard .mark{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);
  text-align:center;font-size:25px;font-weight:800;letter-spacing:.16em;color:rgba(232,238,247,.20);pointer-events:none}
#coverCard .markSub{position:absolute;left:0;right:0;top:53.5%;text-align:center;
  font-size:8px;letter-spacing:.4em;color:rgba(232,238,247,.13);pointer-events:none}
#coverCard .cap{position:absolute;left:0;right:0;bottom:13px;text-align:center;
  font-size:8px;letter-spacing:.26em;color:rgba(232,238,247,.22);pointer-events:none}

/* 스티커 → 셀 모프용 부유 스티커 (오픈형) */
.flySticker{
  position:absolute;z-index:34;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #FFFFFF, #EFEDE4 82%);
  box-shadow:0 2px 6px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.06);
  color:#1B222E;font-weight:900;display:flex;align-items:center;justify-content:center;
  transform-origin:center center;will-change:transform,opacity;
}
.flySticker b{font-family:"Marker Felt","Bradley Hand","Segoe Print",cursive;transform:rotate(-1.5deg)}
/* 셀/스택에서 들려 센터로 오르는 상품 클론 */
.flyPrize{
  position:absolute;z-index:44;border-radius:10px;overflow:hidden;transform-origin:0 0;
  box-shadow:0 22px 55px rgba(0,0,0,.72), 0 0 34px color-mix(in srgb,var(--tier) 40%,transparent);
  will-change:transform;
}
.flyPrize img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- 잭팟 인터루드 (최종 공개 순간 = 최초의 티어 힌트) ---------- */
#dimmer{position:absolute;inset:0;background:#000;z-index:30;pointer-events:none;opacity:0;transition:opacity .5s;will-change:opacity}
#lightline{
  position:absolute;left:-20%;right:-20%;top:44%;height:2px;z-index:35;pointer-events:none;
  background:linear-gradient(90deg,transparent,#FFD700 30%,#FFF8DC 50%,#FFD700 70%,transparent);
  box-shadow:0 0 22px rgba(255,215,0,.9);transform:scaleX(0);opacity:0;will-change:transform,opacity;
}
#lightline.sweep{animation:lineSweep .55s cubic-bezier(.3,0,.2,1) forwards}
@keyframes lineSweep{0%{opacity:0;transform:scaleX(0)}30%{opacity:1}100%{opacity:0;transform:scaleX(1.15)}}

/* ---------- 최종 공개: 카드 스테이지 ---------- */
#cardStage{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;perspective:900px}
#cardStage.show{display:flex}
#floatWrap{will-change:transform}
#floatWrap.floating{animation:idleFloat 3.6s ease-in-out infinite}
@keyframes idleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#tiltWrap{transform-style:preserve-3d;will-change:transform;transition:transform .12s ease-out}
#bigCard{
  position:relative;width:300px;height:419px;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.7), 0 0 44px color-mix(in srgb,var(--tier) 32%,transparent);
  opacity:0;transform:translateY(70px) scale(.72);will-change:transform,opacity;
}
#bigCard.rise{transition:transform .6s cubic-bezier(.2,.85,.3,1),opacity .5s;opacity:1;transform:translateY(0) scale(1)}
#bigCard.zoomSlow{animation:zoomSlow 5s ease-out forwards}
@keyframes zoomSlow{from{scale:1}to{scale:1.06}}
#bigCard img{width:100%;height:100%;object-fit:cover;display:block}
#bigCard .gloss2{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);
  background-size:240% 240%;background-position:50% 50%;will-change:background-position;
}
#jackBanner{
  position:absolute;top:16%;left:0;right:0;z-index:45;text-align:center;pointer-events:none;
  font-size:34px;font-weight:900;letter-spacing:.32em;color:#FFD700;
  text-shadow:0 0 26px rgba(255,215,0,.8),0 2px 6px rgba(0,0,0,.6);opacity:0;transform:scale(1.4);
}
#jackBanner.show{transition:all .7s cubic-bezier(.2,.9,.3,1);opacity:1;transform:scale(1)}
#particles{position:absolute;inset:0;z-index:42;pointer-events:none;overflow:hidden}
#particles i{
  position:absolute;bottom:-12px;width:5px;height:5px;border-radius:50%;background:var(--pcol,#FFD700);opacity:0;
  animation:rise var(--dur,4s) linear var(--del,0s) infinite;will-change:transform,opacity;box-shadow:0 0 8px var(--pcol,#FFD700);
}
@keyframes rise{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  12%{opacity:.85}85%{opacity:.4}
  100%{opacity:0;transform:translateY(-92vh) translateX(var(--dx,0px)) scale(1)}
}

/* ---------- 힌트 / 캡션 ---------- */
#hint{
  position:absolute;left:0;right:0;bottom:150px;z-index:20;text-align:center;pointer-events:none;
  color:var(--sub);font-size:14px;letter-spacing:.02em;opacity:0;transition:opacity .5s;
}
#hint.show{opacity:1}
#hint .finger{display:block;font-size:22px;margin-top:8px;opacity:.55;animation:fingerNudgeY 1.5s ease-in-out infinite}
@keyframes fingerNudgeY{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
#caption{
  position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:20;
  text-align:center;font-size:10px;color:var(--sub);opacity:.45;pointer-events:none;
}

/* ---------- 시작 오버레이 ---------- */
#startOverlay{
  position:absolute;inset:0;z-index:85;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s;
}
#startOverlay.hide{opacity:0;pointer-events:none}
#startOverlay .logo{font-size:44px;font-weight:900;letter-spacing:.06em;
  background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
#startOverlay .sub{font-size:13px;color:var(--sub);margin-bottom:22px}
#drawBtn{
  background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent2) 70%,var(--accent)));
  color:#fff;border:0;border-radius:16px;font-size:17px;font-weight:800;padding:16px 64px;cursor:pointer;letter-spacing:.04em;
  box-shadow:0 8px 30px color-mix(in srgb,var(--accent) 40%,transparent);
}
#drawBtn:active{transform:scale(.97)}

/* ---------- 결과 바텀시트 ---------- */
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:60;
  background:linear-gradient(180deg,rgba(20,28,44,.97),rgba(10,15,26,.99));
  border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:20px 20px calc(96px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.3,1);will-change:transform;
}
#sheet.show{transform:translateY(0)}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 16px}
#sheet .row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#tierChip{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;color:#04080F;background:var(--tier);letter-spacing:.06em;white-space:nowrap}
#rName{font-size:17px;font-weight:800;line-height:1.35;flex:1}
#rSet{font-size:12px;color:var(--sub);margin-bottom:4px}
#rSlot{font-size:11px;color:var(--sub);margin-bottom:12px}
#rSlot b{color:var(--tier)}
#rPts{font-size:24px;font-weight:900;color:var(--tier);margin-bottom:16px;letter-spacing:.01em}
#rPts small{font-size:12px;font-weight:600;color:var(--sub);margin-left:6px}
#sheet .btns{display:flex;gap:10px}
#sheet .btns button{flex:1;border:0;border-radius:14px;padding:15px 0;font-size:15px;font-weight:800;cursor:pointer}
#keepBtn{background:var(--surfEl);color:var(--txt);border:1px solid var(--line)}
#exchBtn{background:var(--accent);color:#fff}
#againBtn{
  display:none;width:100%;margin-top:10px;border:0;border-radius:14px;padding:15px 0;font-size:15px;font-weight:800;cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;
}
#againBtn.show{display:block}
#sheet .btns button:active,#againBtn:active{transform:scale(.98)}

/* ---------- 토스트 ---------- */
#toast{
  position:absolute;left:50%;bottom:calc(180px + env(safe-area-inset-bottom));z-index:80;
  transform:translate(-50%,12px);background:rgba(232,238,247,.94);color:#0B1220;
  font-size:13px;font-weight:700;padding:11px 20px;border-radius:99px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 데모 모드 바 ---------- */
#demobar{
  position:absolute;left:0;right:0;bottom:0;z-index:70;display:flex;align-items:center;gap:6px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(6,10,18,.9);border-top:1px solid var(--line);backdrop-filter:blur(8px);
}
#demobar .chip{
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--sub);
  font-size:11px;font-weight:700;padding:7px 0;border-radius:99px;cursor:pointer;flex:1;text-align:center;transition:all .2s;
}
#demobar .chip.on{color:#04080F;background:var(--txt);border-color:var(--txt)}
#demobar .chip[data-tier="jackpot"].on{background:#FFD700;border-color:#FFD700}
#themeSel{
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--sub);
  font-size:11px;font-weight:700;padding:7px 4px;border-radius:10px;max-width:104px;appearance:none;-webkit-appearance:none;text-align:center;
}
</style>
</head>
<body>
<div id="stage" data-theme="prism">
  <div id="vignette"></div>
  <div id="glow"></div>

  <!-- 까기: 카드 스택 -->
  <div id="packWrap"><div id="pack"></div></div>

  <!-- 봉인판 (공유 픽 화면) -->
  <div id="boardA" class="board">
    <div class="bTitle" id="oripaTitle">리자몽 초고가 오리파</div>
    <div class="bMeta"><b id="oripaPrice">1구 50,000P</b><span id="remainTxt">남은 100 / 100</span></div>
    <div class="gauge"><i id="gaugeFill"></i></div>
    <div id="lineup"></div>
    <div class="bGrid" id="gridA"></div>
  </div>

  <!-- 오픈 전시판 (오픈형 전용: 상품 전량 공개 + 모프 타깃) -->
  <div id="boardC" class="board">
    <div class="bHeadC">
      <div class="bTitle" id="cTitle">이 오리파 구성</div>
      <div class="bMeta2" id="cMeta" style="font-size:12px;color:var(--sub);margin-bottom:12px">남은 — / 100 · 상품 전량 공개</div>
    </div>
    <div id="zoomC" style="transform-origin:0 0;will-change:transform"><div class="bGrid" id="gridC"></div></div>
  </div>

  <div id="lightline"></div>
  <div id="dimmer"></div>

  <!-- 최종 공개 카드 스테이지 -->
  <div id="cardStage">
    <div id="floatWrap"><div id="tiltWrap">
      <div id="bigCard"><img id="bigImg" alt=""><div class="gloss2"></div></div>
    </div></div>
  </div>
  <div id="jackBanner">JACKPOT</div>
  <div id="particles"></div>

  <div id="modeToggle">
    <button data-mode="open" class="on">오픈형</button>
    <button data-mode="closed">비공개형</button>
  </div>
  <div id="dots">
    <div class="dot" data-p="1">1</div>
    <div class="dot" data-p="2">2</div>
    <div class="dot" data-p="3">3</div>
  </div>
  <button id="skipBtn">연출 스킵</button>

  <div id="hint"></div>
  <div id="caption">결과는 이미 서버에서 확정되었습니다 · 연출 스킵 가능</div>

  <div id="confirmBar"><button id="confirmBtn">이 팩 뽑기 · 50,000P</button></div>
  <div id="openDrawBar"><button id="openDrawBtn">봉인팩 뽑기 · 50,000P</button></div>

  <!-- 결과 바텀시트 -->
  <div id="sheet">
    <div class="grab"></div>
    <div class="row1"><span id="tierChip">일반</span><span id="rName">—</span></div>
    <div id="rSet">—</div>
    <div id="rSlot">결과판 <b>—</b>번</div>
    <div id="rPts">0P<small>교환 포인트</small></div>
    <div class="btns">
      <button id="keepBtn">보관하기</button>
      <button id="exchBtn">P로 교환</button>
    </div>
    <button id="againBtn">다시 뽑기</button>
  </div>
  <div id="toast"></div>

  <!-- 데모 모드 바 -->
  <div id="demobar">
    <div class="chip" data-tier="normal">일반</div>
    <div class="chip" data-tier="chance">찬스</div>
    <div class="chip" data-tier="super">슈퍼</div>
    <div class="chip" data-tier="ultra">울트라</div>
    <div class="chip" data-tier="jackpot">잭팟</div>
    <select id="themeSel">
      <option value="prism">테마: 다크 프리즘</option>
      <option value="flame">테마: 화염</option>
    </select>
  </div>

  <!-- 시작 오버레이 -->
  <div id="startOverlay">
    <div class="logo">oripa</div>
    <div class="sub">오픈형 · 비공개형 — 두 오리파 REVEAL 데모</div>
    <button id="drawBtn">뽑기 시작</button>
  </div>
</div>

<script src="data.js"></script>
<script>
// ===JS===
/* ============================================================
   oripa REVEAL — 두 오리파 타입 (공유 draw 메커닉)
   공유: 봉인판(겹친카드 그리드) → 유저가 하나 픽 → 표지 내리기(peel).
   ● 비공개형(closed): 표지 아래 = 실제 상품 카드. 번호/보드 없음.
                       완전 peel → 상품이 센터로 확대 → 티어 스테이징 → 시트.
   ● 오픈형(open): 전시판(상품 전량 FACE-UP + 뽑힌 검은 빈칸) → 봉인팩 픽 → peel
                   → 필러 카드 + 번호 스티커 → 스티커가 전시판 셀로 모프
                   → 셀 줌 → 티어 스테이징(셀에서 발화) → 상품이 셀에서 들려 센터로 → 시트.
   ★ 티어 힌트(글로우/암전)는 최종 공개 순간에만. 표지/봉인판엔 전조 전무.
   추첨은 픽/뽑기 확정 시점에 서버 확정, 이후 전부 "연극". 스킵=동일결과 즉시.
   phase: -1 대기 / 'O' 오픈전시(인트로) / 'A' 봉인판픽 / 0 플라이 /
          1 표지내리기 / 2.5 표지낙하 / 2.6 스티커모프(open) / 2.7 공개스테이징 / 3 최종
   ============================================================ */
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage'),packWrap=$('packWrap'),pack=$('pack'),glow=$('glow'),
      hint=$('hint'),dots=$('dots'),skipBtn=$('skipBtn'),dimmer=$('dimmer'),
      lightline=$('lightline'),cardStage=$('cardStage'),bigCard=$('bigCard'),
      bigImg=$('bigImg'),gloss2=document.querySelector('#bigCard .gloss2'),
      floatWrap=$('floatWrap'),tiltWrap=$('tiltWrap'),jackBanner=$('jackBanner'),
      particles=$('particles'),sheet=$('sheet'),toastEl=$('toast'),
      boardA=$('boardA'),boardC=$('boardC'),gridA=$('gridA'),gridC=$('gridC'),
      zoomC=$('zoomC'),confirmBar=$('confirmBar'),openDrawBar=$('openDrawBar');

const TIERS={
  normal :{label:'일반',    color:'#E8EEF7', band:[0,3000],           dim:0,   weight:.55, beat:120},
  chance :{label:'찬스',    color:'#4D8FEA', band:[3000,20000],       dim:0,   weight:.25, beat:320},
  super  :{label:'슈퍼',    color:'#9D5CFF', band:[20000,100000],     dim:.20, weight:.12, beat:480},
  ultra  :{label:'울트라',  color:'#FFCC00', band:[100000,500000],    dim:.35, weight:.06, beat:750},
  jackpot:{label:'JACKPOT', color:'#FFD700', band:[500000,Infinity],  dim:.35, weight:.02, beat:0},
};
const POOLS={};
for(const k in TIERS){const[lo,hi]=TIERS[k].band;POOLS[k]=CARDS.filter(c=>c.price>=Math.max(lo,100)&&c.price<hi&&c.id&&c.img)}
const FILLERS=CARDS.filter(c=>c.price>=100&&c.price<3000&&c.id&&c.img);   // 오픈형 필러 = 저가 카드
const imgUrl=c=>`${CDN}/${c.img}/${c.id}.png`;
const fmt=n=>n.toLocaleString('ko-KR');
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const JIT=[-0.6,0.3,-0.2,0.5,-0.4,0.2,-0.5,0.4,-0.3,0.6,0.1,-0.5,0.35,-0.15];
function tierOf(c){const p=c.price;for(const k in TIERS){const[lo,hi]=TIERS[k].band;if(p>=lo&&p<hi)return k}return 'normal'}

// ---------- 오리파 구성 (서버 확정) : 번호 1..100 → 상품 카드 ----------
const ORIPA={title:'리자몽 초고가 오리파',price:50000,total:100,preDrawn:27};
const board={prize:new Map(),drawn:new Set(),packGone:new Set()};
function buildComposition(){
  board.prize=new Map();board.drawn=new Set();board.packGone=new Set();
  const nums=[...Array(ORIPA.total)].map((_,i)=>i+1).sort(()=>Math.random()-.5);
  let i=0;
  const plant=(pool,count)=>{const P=pool&&pool.length?pool:CARDS;for(let k=0;k<count&&i<ORIPA.total;k++)board.prize.set(nums[i++],rnd(P))};
  plant(POOLS.jackpot,1);plant(POOLS.ultra,4);plant(POOLS.super,9);plant(POOLS.chance,26);
  plant(POOLS.normal,ORIPA.total-i);                       // 나머지 = 일반
  // 사전 소진 27 = 상위(≥2만) 미출현 → "메인 아직 살아있음" 스토리
  const drawable=[...board.prize.keys()].filter(n=>board.prize.get(n).price<20000);
  drawable.sort(()=>Math.random()-.5).slice(0,ORIPA.preDrawn).forEach(n=>board.drawn.add(n));
  const poss=[...Array(ORIPA.total)].map((_,i)=>i).sort(()=>Math.random()-.5);
  poss.slice(0,ORIPA.preDrawn).forEach(p=>board.packGone.add(p));   // 봉인판 코스메틱 빈자리
}
const remaining=()=>ORIPA.total-board.drawn.size;
const freeNums=()=>{const f=[];for(let n=1;n<=ORIPA.total;n++)if(!board.drawn.has(n))f.push(n);return f};

// ---------- 전역 상태 ----------
let mode='open';        // 'open' | 'closed'
let _phase=-1;
let result=null;        // {tier, card, num}
let filler=null;        // 오픈형: 번호 캐리어 (상품 아님)
let selPos=null;        // 봉인판에서 고른 위치
let forcedTier=null;
let timers=[];
const after=(ms,fn)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};
Object.defineProperty(window,'__phase',{get:()=>_phase});
Object.defineProperty(window,'__mode',{get:()=>mode});
Object.defineProperty(window,'__result',{get:()=>result});
Object.defineProperty(window,'__filler',{get:()=>filler});

function setDots(p){
  dots.classList.toggle('show',p>=1&&p<=3);
  dots.querySelectorAll('.dot').forEach(d=>{const n=+d.dataset.p;d.classList.toggle('on',n===p);d.classList.toggle('past',n<p)});
}
function setHint(txt,finger){
  if(!txt){hint.classList.remove('show');return}
  hint.innerHTML=txt+(finger?'<span class="finger">👇</span>':'');
  hint.classList.add('show');
}
let toastTimer=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200)}
function killToast(){clearTimeout(toastTimer);toastEl.classList.remove('show')}

// ============================================================
// 진입 라우팅 (모드별)
// ============================================================
function goEntry(){ if(mode==='open')showOpenIntro(); else showBoardA(); }

// --- 오픈형 인트로: FACE-UP 전시판 (상품 전량 공개) + 뽑기 진입 ---
function showOpenIntro(){
  _phase='O';stage.dataset.phase='O';selPos=null;
  setDots(0);setHint('');
  skipBtn.classList.remove('show');confirmBar.classList.remove('show');
  packWrap.style.opacity=0;
  boardA.classList.remove('show');
  buildOpenBoard(false);
  $('cTitle').textContent='리자몽 초고가 오리파 · 구성';
  $('cMeta').textContent=`남은 ${remaining()} / ${ORIPA.total} · 상품 전량 공개`;
  boardC.classList.remove('dimmed');boardC.classList.add('show');boardC.style.opacity=1;
  zoomC.style.transition='none';zoomC.style.transform='none';
  openDrawBar.classList.add('show');
}
$('openDrawBtn').addEventListener('click',()=>{
  if(_phase!=='O')return;
  openDrawBar.classList.remove('show');
  boardC.classList.remove('show');
  showBoardA();
});

// --- 봉인판 (공유 픽): 겹친 카드 그리드 ---
function showBoardA(){
  _phase='A';stage.dataset.phase='A';selPos=null;
  setDots(0);setHint('');
  skipBtn.classList.remove('show');confirmBar.classList.remove('show');openDrawBar.classList.remove('show');
  packWrap.style.opacity=0;boardC.classList.remove('show');
  $('remainTxt').textContent=`남은 ${remaining()} / ${ORIPA.total}`;
  $('gaugeFill').style.width=(remaining()/ORIPA.total*100)+'%';
  buildLineup();
  gridA.classList.remove('picking');gridA.innerHTML='';
  for(let p=0;p<ORIPA.total;p++){
    const el=document.createElement('div');
    const gone=board.packGone.has(p);
    el.className='mpack'+(gone?' gone':'');el.dataset.pos=p;
    if(!gone){
      el.style.setProperty('--jit',JIT[p%JIT.length]+'deg');
      el.style.setProperty('--d',((p*0.11)%3.6).toFixed(2)+'s');
      el.innerHTML='<div class="stk"></div>';
    }
    gridA.appendChild(el);
  }
  boardA.classList.add('show');boardA.style.opacity=1;boardA.style.pointerEvents='';
}
function buildLineup(){
  const top3=[...CARDS].filter(c=>c.id&&c.img).sort((a,b)=>b.price-a.price).slice(0,3);
  $('lineup').innerHTML=top3.map(c=>`
    <div class="lu"><img src="${imgUrl(c)}" alt="">
      <div class="li"><div class="ln">${c.name}</div><div class="lp">${fmt(c.price)}P</div></div>
    </div>`).join('');
}
gridA.addEventListener('click',e=>{
  if(_phase!=='A')return;
  const cell=e.target.closest('.mpack');
  if(!cell||cell.classList.contains('gone'))return;
  gridA.querySelectorAll('.mpack.sel').forEach(x=>x.classList.remove('sel'));
  cell.classList.add('sel');gridA.classList.add('picking');
  selPos=+cell.dataset.pos;vib(8);
  confirmBar.classList.add('show');
});
$('confirmBtn').addEventListener('click',()=>{if(_phase==='A'&&selPos!=null)doDraw()});

// --- 오픈 전시판 렌더 (FACE-UP + 검은 빈칸) ---
function buildOpenBoard(withMine){
  gridC.innerHTML='';
  for(let n=1;n<=ORIPA.total;n++){
    const el=document.createElement('div');
    el.className='ocell';el.dataset.num=n;
    if(board.drawn.has(n)){el.classList.add('gap')}
    else{
      const c=board.prize.get(n);
      el.innerHTML=`<img src="${imgUrl(c)}" alt="" loading="lazy"><span class="ntag">${n}</span>`;
      if(withMine&&result&&n===result.num)el.classList.add('mine');
    }
    gridC.appendChild(el);
  }
}

// ============================================================
// 뽑기 확정 — 번호+상품 서버 확정 + 프리로드
// ============================================================
function doDraw(){
  clearTimers();killToast();
  const free=freeNums();
  let num;
  if(forcedTier){
    const cands=free.filter(n=>tierOf(board.prize.get(n))===forcedTier);
    if(cands.length)num=rnd(cands);
    else{num=rnd(free);board.prize.set(num,rnd(POOLS[forcedTier].length?POOLS[forcedTier]:CARDS))}
  }else{
    num=rnd(free);
  }
  const card=board.prize.get(num);
  result={tier:forcedTier||tierOf(card),card,num};
  filler = mode==='open' ? rnd(FILLERS.length?FILLERS:CARDS) : null;
  new Image().src=imgUrl(card);
  if(filler)new Image().src=imgUrl(filler);
  stage.style.setProperty('--tier',TIERS[result.tier].color);
  buildStack();
  flyToStack();
}

// ============================================================
// 스택 DOM — 오픈=필러+스티커 / 비공개=실상품(스티커 없음). 표지는 동일.
// ============================================================
let coverEl=null,resultEl=null,edgeEl=null;
function buildStack(){
  pack.className='';pack.style.opacity=0;pack.style.transition='';
  const underImg=mode==='open'?imgUrl(filler):imgUrl(result.card);
  const stickerHTML=mode==='open'?`<div class="sticker"><span>No.</span><b>${result.num}</b></div>`:'';
  pack.innerHTML=`
    <div id="resultCard">
      <img alt="" src="${underImg}">
      <div class="gloss"></div>
      ${stickerHTML}
      <div id="revealEdge"></div>
    </div>
    <div id="coverCard">
      <div class="mark">oripa</div>
      <div class="markSub">ORIGINAL PACK</div>
      <div class="cap">표지 카드 · COVER</div>
    </div>`;
  coverEl=pack.querySelector('#coverCard');
  resultEl=pack.querySelector('#resultCard');
  edgeEl=pack.querySelector('#revealEdge');
  cv={y:0,target:0,x:0,rot:0,fingerDX:0,dragging:false,spring:false,baseY:0,startY:0,startX:0,pid:null,lastTick:0,stick:0,hitch:0};
}

// ============================================================
// Phase 0 — 고른 카드가 센터로 날아와 스택 확대 (티어 무관 동일)
// ============================================================
function flyToStack(){
  _phase=0;stage.dataset.phase=0;
  confirmBar.classList.remove('show');boardA.style.pointerEvents='none';
  skipBtn.classList.add('show');glow.style.opacity=0;
  const cell=gridA.querySelector(`.mpack[data-pos="${selPos}"]`);
  const sr=stage.getBoundingClientRect();
  const clone=document.createElement('div');clone.id='flyPack';
  if(cell){const r=cell.getBoundingClientRect();clone.style.transform=`translate(${r.left-sr.left}px,${r.top-sr.top}px) scale(${r.width/264})`}
  else{clone.style.transform=`translate(${sr.width/2-132}px,${sr.height}px) scale(.3)`}
  stage.appendChild(clone);void clone.offsetWidth;
  if(cell){cell.classList.remove('sel');cell.classList.add('gone');cell.innerHTML=''}
  gridA.classList.remove('picking');
  after(170,()=>{
    boardA.style.transition='opacity .4s';boardA.style.opacity=0;
    clone.style.transform=`translate(${sr.width/2-132}px,${sr.height*.44-184.5}px) scale(1)`;vib(10);
  });
  after(170+560,()=>{
    clone.remove();boardA.classList.remove('show');boardA.style.transition='';
    packWrap.style.opacity=1;pack.classList.add('settle');
    after(300,enterPhase1);
  });
}

// ============================================================
// Phase 1 — 표지 내리기 (마찰/드리프트/지연/미세스틱)
// ============================================================
const COVER={RESIST:0.35,RELEASE_TH:0.30,DONE_TH:0.85,FULL:360,K:0.12,DAMP:0.82,OVER:14,TICK:26,
             XK:0.06,ROTK:0.02,ROTMAX:1.2,STICK:40,FOLLOW:0.4,HITCH:0.14};
let cv={y:0,target:0,x:0,rot:0,fingerDX:0,dragging:false,spring:false,baseY:0,startY:0,startX:0,pid:null,lastTick:0,stick:0,hitch:0};
Object.defineProperty(window,'__coverY',{get:()=>cv.y});

function enterPhase1(){
  _phase=1;stage.dataset.phase=1;setDots(1);
  setHint('표지를 조금씩 내려보세요',true);
}
packWrap.addEventListener('pointerdown',e=>{
  if(_phase!==1)return;
  try{packWrap.setPointerCapture(e.pointerId)}catch(_){}
  cv.pid=e.pointerId;cv.dragging=true;cv.spring=false;
  cv.startY=e.clientY;cv.startX=e.clientX;cv.baseY=cv.y;cv.fingerDX=0;
  cv.lastTick=cv.y;cv.stick=cv.y;cv.hitch=6;
  packWrap.classList.remove('shake');void packWrap.offsetWidth;packWrap.classList.add('shake');
  hint.classList.remove('show');e.preventDefault();
});
packWrap.addEventListener('pointermove',e=>{
  if(_phase!==1||!cv.dragging||e.pointerId!==cv.pid)return;
  const dy=e.clientY-cv.startY;cv.fingerDX=e.clientX-cv.startX;
  let raw=cv.baseY+dy*COVER.RESIST;
  if(raw<0)raw=Math.max(-COVER.OVER,raw*0.25);
  cv.target=Math.min(COVER.FULL,raw);
});
function coverRelease(e){
  if(_phase!==1||!cv.dragging||e.pointerId!==cv.pid)return;
  cv.dragging=false;
  if(cv.y/COVER.FULL<COVER.RELEASE_TH){cv.spring=true;cv.v=0}
}
packWrap.addEventListener('pointerup',coverRelease);
packWrap.addEventListener('pointercancel',coverRelease);

function tick(){
  if(_phase===1&&coverEl){
    let follow=COVER.FOLLOW;
    if(cv.hitch>0){follow=COVER.HITCH;cv.hitch--}
    if(cv.dragging){
      cv.y+=(cv.target-cv.y)*follow;
      if(Math.abs(cv.y-cv.stick)>=COVER.STICK){cv.stick=cv.y;cv.hitch=6}
    }else if(cv.spring){
      cv.v+=(0-cv.y)*COVER.K;cv.v*=COVER.DAMP;cv.y+=cv.v;
      if(Math.abs(cv.y)<.4&&Math.abs(cv.v)<.4){cv.y=0;cv.spring=false}
    }
    const txT=cv.dragging?cv.fingerDX*COVER.XK:0;
    const rotT=cv.dragging?Math.max(-COVER.ROTMAX,Math.min(COVER.ROTMAX,cv.fingerDX*COVER.ROTK)):0;
    cv.x+=(txT-cv.x)*0.2;cv.rot+=(rotT-cv.rot)*0.2;
    if(Math.abs(cv.y-cv.lastTick)>=COVER.TICK){cv.lastTick=cv.y;vib(8)}
    const p=Math.max(0,cv.y/COVER.FULL);
    coverEl.style.transform=`translate(${(2+cv.x).toFixed(2)}px,${cv.y.toFixed(2)}px) rotate(${(1+cv.rot).toFixed(2)}deg)`;
    edgeEl.style.transform=`translateY(${cv.y.toFixed(2)}px)`;
    edgeEl.style.opacity=cv.y>4?1:0;
    if(p>=COVER.DONE_TH)completeCover();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ============================================================
// Phase 2.5 — 표지 낙하 → 모드 분기
// ============================================================
function completeCover(){
  if(_phase!==1)return;
  _phase=2.5;stage.dataset.phase=2.5;
  cv.dragging=false;cv.spring=false;setHint('');edgeEl.style.opacity=0;
  coverEl.style.transition='transform .55s cubic-bezier(.5,0,.8,.4), opacity .4s ease-in .12s';
  coverEl.style.transform=`translate(${(12+cv.x).toFixed(1)}px,${cv.y+430}px) rotate(10deg)`;
  coverEl.style.opacity=0;vib(14);
  if(mode==='closed'){
    after(560,closedReveal);                       // 표지 아래 = 실상품 → 바로 공개
  }else{
    after(380,()=>{resultEl.querySelector('.sticker').classList.add('pulse');vib(20)});  // 번호 확인
    after(380+560,stickerMorph);                   // 시그니처 모프
  }
}

// ============================================================
// 비공개형 공개 — 상품이 스택에서 들려 센터로 (티어 스테이징 HERE)
// ============================================================
function closedReveal(){
  _phase=2.7;stage.dataset.phase=2.7;
  const t=result.tier;
  const go=()=>{const r=resultEl.getBoundingClientRect();packWrap.style.opacity=0;liftToCenter(r,null,()=>settleCenter(true))};
  if(t==='jackpot')jackpotInterlude(go);           // 최초 티어 힌트 = 블랙아웃→광선→진동
  else after(TIERS[t].beat,go);
}

// ============================================================
// 오픈형 시그니처 — 번호 스티커 → 전시판 셀 연속 모프 (FLIP, transform-only)
// ============================================================
function stickerMorph(){
  _phase=2.6;stage.dataset.phase=2.6;setDots(2);
  const sr=stage.getBoundingClientRect();
  const st=resultEl.querySelector('.sticker');
  const from=st.getBoundingClientRect();
  buildOpenBoard(true);
  $('cTitle').textContent='리자몽 초고가 오리파 · 구성';
  $('cMeta').textContent=`내 번호 No.${result.num} · 상품 전량 공개`;
  boardC.classList.remove('dimmed');boardC.classList.add('show');boardC.style.opacity=0;
  zoomC.style.transition='none';zoomC.style.transform='none';
  const targetCell=gridC.querySelector(`.ocell[data-num="${result.num}"]`);
  const to=targetCell.getBoundingClientRect();
  const fly=document.createElement('div');fly.className='flySticker';fly.id='flySticker';
  fly.style.left=(from.left-sr.left)+'px';fly.style.top=(from.top-sr.top)+'px';
  fly.style.width=from.width+'px';fly.style.height=from.height+'px';
  fly.style.fontSize=(from.height*0.42)+'px';fly.style.transform='rotate(-3deg)';
  fly.innerHTML=`<b>${result.num}</b>`;stage.appendChild(fly);
  packWrap.style.transition='opacity .45s ease';packWrap.style.opacity=0;
  const scale=to.width/from.width;
  const dx=(to.left+to.width/2)-(from.left+from.width/2);
  const dy=(to.top+to.height/2)-(from.top+from.height/2);
  requestAnimationFrame(()=>{
    boardC.style.transition='opacity .5s ease';boardC.style.opacity=1;
    fly.style.transition='transform .6s cubic-bezier(.5,0,.2,1)';
    fly.style.transform=`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(${scale.toFixed(3)}) rotate(0deg)`;
  });
  vib(10);
  after(600,()=>{fly.remove();openReveal()});
}

// ============================================================
// 오픈형 공개 — 셀 줌 → 티어 스테이징(셀 발화) → 상품이 셀에서 들려 센터로 (플립 아님)
// ============================================================
function openReveal(){
  _phase=2.7;stage.dataset.phase=2.7;
  const mineCell=gridC.querySelector(`.ocell[data-num="${result.num}"]`);
  after(380,()=>{
    zoomTo(mineCell);
    after(880,()=>{
      const lift=()=>{
        mineCell.classList.remove('mine');
        const img=mineCell.querySelector('img');
        const r=(img||mineCell).getBoundingClientRect();
        liftToCenter(r,mineCell,()=>settleCenter(true));
      };
      if(result.tier==='jackpot')jackpotInterlude(lift);
      else after(TIERS[result.tier].beat,lift);
    });
  });
}
// 카메라 줌: 대상 셀이 화면 중앙(높이 42%)에 오도록 scale+translate (transform only)
function zoomTo(el){
  const S=2.6;
  const sr=stage.getBoundingClientRect(),zr=zoomC.getBoundingClientRect(),r=el.getBoundingClientRect();
  const px=r.left+r.width/2-zr.left, py=r.top+r.height/2-zr.top;
  const tx=(sr.width/2)-(zr.left-sr.left)-S*px;
  const ty=(sr.height*.42)-(zr.top-sr.top)-S*py;
  zoomC.style.transition='transform .85s cubic-bezier(.25,.8,.3,1)';void zoomC.offsetWidth;
  zoomC.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${S})`;
}
// 잭팟 인터루드 — 0.7초 완전 암전 → 수평 광선 → 강진동 → then()
function jackpotInterlude(then){
  dimmer.style.transition='opacity .35s';dimmer.style.opacity=1;
  after(700,()=>{
    lightline.classList.add('sweep');
    after(300,()=>vib(40));
    after(560,()=>{
      dimmer.style.transition='opacity .5s';dimmer.style.opacity=TIERS.jackpot.dim;
      lightline.classList.remove('sweep');glow.style.opacity=.8;
      after(250,then);
    });
  });
}
// 상품 클론이 셀/스택에서 들려 센터로 상승 (플립 아님). cell 지정 시 셀 → 검은 빈칸.
function liftToCenter(rect,cell,done){
  const sr=stage.getBoundingClientRect();
  const clone=document.createElement('div');clone.className='flyPrize';clone.id='flyPrize';
  clone.style.left=(rect.left-sr.left)+'px';clone.style.top=(rect.top-sr.top)+'px';
  clone.style.width=rect.width+'px';clone.style.height=rect.height+'px';
  clone.innerHTML=`<img src="${imgUrl(result.card)}" alt="">`;
  stage.appendChild(clone);
  if(cell){cell.classList.add('gap')}              // 카드가 빠져나감 → 검은 빈칸
  glow.style.opacity=result.tier==='normal'?.4:.85;  // ★ 여기서부터 티어 글로우
  const scale=300/rect.width;
  const fw=rect.width*scale, fh=rect.height*scale;
  const dx=sr.width/2 - fw/2 - (rect.left-sr.left);
  const dy=sr.height*0.44 - fh/2 - (rect.top-sr.top);
  requestAnimationFrame(()=>{
    clone.style.transition='transform .6s cubic-bezier(.2,.8,.3,1)';
    clone.style.transform=`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(${scale.toFixed(3)})`;
  });
  vib(14);
  after(600,()=>{clone.remove();done()});
}

// ============================================================
// Phase 3 — 센터 정착 (티어 연출 + 시트). fromLift=셀/스택에서 이미 올라옴
// ============================================================
function settleCenter(fromLift){
  _phase=3;stage.dataset.phase=3;setDots(3);
  const t=result.tier,T=TIERS[t];
  packWrap.style.opacity=0;
  if(mode==='open')boardC.classList.add('dimmed');   // 헤더만 dim, 전시판 그리드는 뒤에 계속 보임
  bigImg.src=imgUrl(result.card);
  cardStage.classList.add('show');
  dimmer.style.transition='opacity .8s';dimmer.style.opacity=t==='normal'?0:T.dim;
  glow.style.opacity=t==='normal'?.3:.65;
  if(fromLift){bigCard.classList.remove('rise');bigCard.style.transition='opacity .28s ease';bigCard.style.opacity=1;bigCard.style.transform='none'}
  else{bigCard.classList.add('rise')}
  if(t==='jackpot'){bigCard.classList.add('zoomSlow');jackBanner.classList.add('show');spawnParticles();vib(40)}
  after(fromLift?70:650,()=>{
    floatWrap.classList.add('floating');tiltOn=true;
    after(fromLift?130:450,showSheet);
  });
}

function spawnParticles(){
  particles.innerHTML='';
  const col=stage.dataset.theme==='flame'?'#FF8C55':'#FFD700';
  for(let i=0;i<26;i++){
    const p=document.createElement('i');
    p.style.left=(4+Math.random()*92)+'%';
    p.style.setProperty('--dur',(3.4+Math.random()*2.6)+'s');
    p.style.setProperty('--del',(Math.random()*3)+'s');
    p.style.setProperty('--dx',((Math.random()-.5)*70)+'px');
    p.style.setProperty('--pcol',col);
    p.style.width=p.style.height=(3+Math.random()*4)+'px';
    particles.appendChild(p);
  }
}

// ---------- 포인터 틸트 + 글로스 카운터 스윕 (±0.09rad ≈ 5.16°) ----------
let tiltOn=false;
stage.addEventListener('pointermove',e=>{
  if(!tiltOn||_phase!==3)return;
  const r=stage.getBoundingClientRect();
  const nx=(e.clientX-r.left)/r.width-.5, ny=(e.clientY-r.top)/r.height-.5, MAX=5.16;
  tiltWrap.style.transform=`rotateY(${(nx*2*MAX).toFixed(2)}deg) rotateX(${(-ny*2*MAX).toFixed(2)}deg)`;
  gloss2.style.backgroundPosition=`${50-nx*120}% ${50-ny*120}%`;
});
stage.addEventListener('pointerleave',()=>{if(tiltOn)tiltWrap.style.transform='rotateY(0deg) rotateX(0deg)'});

// ---------- 결과 바텀시트 ----------
function showSheet(){
  const T=TIERS[result.tier],c=result.card;
  $('tierChip').textContent=T.label;
  $('rName').textContent=c.name;
  $('rSet').textContent=`${c.set||''} · ${c.num||''} · ${c.rarity||''}`;
  $('rSlot').innerHTML = mode==='open' ? `전시판 <b>No.${result.num}</b>번` : `비공개 추첨 · 번호 <b>No.${result.num}</b>`;
  $('rPts').innerHTML=`${fmt(c.price)}P<small>교환 포인트</small>`;
  $('exchBtn').textContent=`${fmt(c.price)}P로 교환`;
  $('againBtn').classList.remove('show');
  sheet.classList.add('show');skipBtn.classList.remove('show');
}
$('keepBtn').addEventListener('click',()=>{toast('보관함에 담겼어요');$('againBtn').classList.add('show')});
$('exchBtn').addEventListener('click',()=>{toast(`${fmt(result.card.price)}P가 지급되었어요`);$('againBtn').classList.add('show')});
$('againBtn').addEventListener('click',()=>{
  consumeDraw();resetAll();
  if(remaining()<=0){toast('완판! 오리파가 종료되었습니다');return}
  goEntry();
});
function consumeDraw(){
  if(!result)return;
  board.drawn.add(result.num);
  if(selPos!=null)board.packGone.add(selPos);
  result=null;filler=null;selPos=null;
}

// ---------- 스킵 (결과 확정 → 최종 상태로 점프) ----------
skipBtn.addEventListener('click',()=>{
  if(!result||_phase>=3)return;
  clearTimers();killToast();
  ['flySticker','flyPack','flyPrize'].forEach(id=>{const e=$(id);if(e)e.remove()});
  boardA.classList.remove('show');boardA.style.transition='';boardA.style.opacity=1;boardA.style.pointerEvents='';
  packWrap.style.transition='';packWrap.style.opacity=0;
  lightline.classList.remove('sweep');dimmer.style.opacity=0;
  if(mode==='open'){
    buildOpenBoard(true);
    const mc=gridC.querySelector(`.ocell[data-num="${result.num}"]`);if(mc)mc.classList.add('gap');
    boardC.classList.add('show');boardC.style.opacity=1;
    zoomC.style.transition='none';zoomC.style.transform='none';
  }
  settleCenter(true);
});

// ---------- 리셋 ----------
function resetAll(){
  clearTimers();
  _phase=-1;stage.dataset.phase=-1;tiltOn=false;
  ['flySticker','flyPack','flyPrize'].forEach(id=>{const e=$(id);if(e)e.remove()});
  sheet.classList.remove('show');cardStage.classList.remove('show');
  bigCard.classList.remove('rise','zoomSlow');bigCard.style.transition='';bigCard.style.opacity='';bigCard.style.transform='';
  floatWrap.classList.remove('floating');tiltWrap.style.transform='';
  jackBanner.classList.remove('show');particles.innerHTML='';
  dimmer.style.opacity=0;glow.style.opacity=0;
  boardC.classList.remove('show','dimmed');boardC.style.opacity=1;
  zoomC.style.transition='none';zoomC.style.transform='none';
  boardA.classList.remove('show');
  packWrap.style.transition='';packWrap.style.opacity=0;
  openDrawBar.classList.remove('show');confirmBar.classList.remove('show');
  setDots(0);setHint('');
}

// ---------- 모드 토글 ----------
document.querySelectorAll('#modeToggle button').forEach(b=>{
  b.addEventListener('click',()=>{
    const m=b.dataset.mode;if(m===mode)return;
    mode=m;
    document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));
    clearTimers();killToast();
    // 시작 오버레이가 떠 있으면 진입 안 함(뽑기 시작 대기)
    if(!$('startOverlay').classList.contains('hide'))return;
    resetAll();goEntry();
    toast(m==='open'?'오픈형 · 상품 전량 공개':'비공개형 · 미스터리');
  });
});

// ---------- 데모 모드 바 (티어 강제) ----------
document.querySelectorAll('#demobar .chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    const t=chip.dataset.tier;
    if(forcedTier===t){forcedTier=null;chip.classList.remove('on')}
    else{forcedTier=t;document.querySelectorAll('#demobar .chip').forEach(c=>c.classList.remove('on'));chip.classList.add('on')}
    toast(forcedTier?`다음 뽑기: ${TIERS[t].label}`:'다음 뽑기: 랜덤');
  });
});
$('themeSel').addEventListener('change',e=>{stage.dataset.theme=e.target.value});

// ---------- 시작 ----------
buildComposition();
$('drawBtn').addEventListener('click',()=>{$('startOverlay').classList.add('hide');goEntry()});

document.documentElement.dataset.ok='1';
</script>
</body>
