const won=n=>(!n)?'—':'₩'+Number(n).toLocaleString();

function bug(b){return {SPREAD_PICKED_EN:['JP있는데 EN선택','b-spread'],EN_ONLY_NO_JP_RAW:['JP RAW없음→EN','b-noJp'],EN_PICKED_COEF:['EN선택+계수','b-coef'],JP_PICKED_COEF_CRUSH:['JP선택+계수죽임','b-coef'],OTHER:['기타','b-coef']}[b]||[b,'b-coef']}
function ev(e){return {SELECTION_BUG:['✓ 선택버그(증명)','e-sel'],SNK_GROUND_TRUTH:['✓ SNK실거래 반증','e-snk'],SNK_THIN:['SNK 얇음','e-thin'],COEF_ASSUMPTION:['계수가정(약함)','e-coef']}[e]||[e,'e-coef']}
function render(){
  const list=document.getElementById('list');

  list.innerHTML=rows.map(r=>{
    const vals=[['KO 표시',r.ko_price,'x-ko',false],['EN RAW',r.en_raw,'x-en',r.selected_source==='EN'],['JP RAW',r.jp_raw,'x-jp',r.selected_source==='JP'],['SNK 실거래',r.snk_raw,'x-snk',false],['JP PSA10',r.jp_p10,'x-p10',false]];
    const mx=Math.max(...vals.map(v=>v[1]||0),1);
    const [bt,bc]=bug(r.bug_type);const [et,ec]=ev(r.evidence_strength);
    const bars=vals.map(([lbl,v,cls,chosen])=>`<div class="bl">${lbl}${chosen?' ←선택':''}</div><div><div class="bar ${cls} ${chosen?'chosen':''}" style="width:${logw(v,mx)}%"></div></div><div class="bv">${won(v)}${lbl==='SNK 실거래'&&r.snk_n?` <span class="mut">n${r.snk_n}</span>`:''}</div>`).join('');
    return `<div class="card">
      <div class="hd"><span class="nm">${r.name} <span class="mut" style="font-size:12px">${r.rarity} ${r.num}</span></span>
        <span><span class="sev ${ec}">${et}</span> <span class="sev s-${r.severity}">${r.severity} ${r.under_x}x</span> <span class="badge ${bc}">${bt}</span></span></div>
      <div class="mut" style="font-size:11px;margin-top:2px">jp:${r.jp_ref} · en:${r.en_ref} · 선택=${r.selected_source}/계수 ${r.coef}(${r.coef_key})${r.ladder_broken?' · <span style="color:#f85149">ladder '+r.ladder_broken+'</span>':''}</div>
      <div class="bars">${bars}</div>
      <div class="note">시스템: <b>${won(r.ko_price)}</b> 표시 (=${r.selected_source} RAW ${won(r.selected_source==='EN'?r.en_raw:r.jp_raw)} × 계수 ${r.coef}). 진짜값 <b>${won(r.ref)}</b> (${r.ref_basis})${r.spread_jp_over_en?` · JP가 EN의 <b>${r.spread_jp_over_en}배</b>인데 EN 선택`:''} → <b style="color:#f85149">${r.under_x}배 과소</b></div>
    </div>`;

}
function mkFilters(){
  const f=document.getElementById('filters');

  const bugs=['ALL',...new Set(ROWS.map(r=>r.bug_type))];
  const sevs=['ALL','CRITICAL','HIGH','MED'];
  f.innerHTML='<span class="mut" style="align-self:center">증거:</span>'+evs.map(e=>`<button data-ev="${e}" class="${e==='ALL'?'on':''}">${e}</button>`).join('')
