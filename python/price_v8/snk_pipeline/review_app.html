<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNK 가격 검수 ⑤</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#30363d;--mut:#9da7b3;--grn:#3fb950;--blu:#58a6ff;--pur:#bc8cff;--amber:#d2a44a;--red:#f85149;--yel:#d29922;--org:#db6d28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6edf3;font:13px/1.45 -apple-system,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d1117ee;backdrop-filter:blur(4px);z-index:8}
header b{font-size:15px}.mut{color:var(--mut)}.pill{padding:2px 9px;border:1px solid var(--line);border-radius:99px;font-size:11px}
.wrap{max-width:1240px;margin:0 auto;padding:14px}
.nav{display:flex;gap:10px;align-items:center;margin:6px 0 12px}
button{font:inherit;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:#21262d;color:#e6edf3;cursor:pointer}
button:hover{filter:brightness(1.2)}button .k{opacity:.55;font-size:11px;margin-left:3px}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
.banner{display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:center;background:linear-gradient(90deg,#1f6feb14,transparent);border:1px solid #1f6feb44;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.banner h2{margin:0;font-size:19px}.banner .conf{font-size:11px;font-weight:700;color:var(--grn);border:1px solid var(--grn);border-radius:5px;padding:2px 7px}
.bigprice{font-size:15px;text-align:right}.bigprice b{font-size:20px}.down{color:var(--red)}
.reason{grid-column:1/-1;font-size:12px;color:#c9d1d9;border-top:1px solid #1f6feb33;padding-top:8px;margin-top:2px}
.imgrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.imgcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.imgcard .hd{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.imgbox{aspect-ratio:.715;background:#0d1117;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;max-height:420px}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.imeta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin-top:10px}
.imeta div:nth-child(odd){color:var(--mut)}
.imgbtns{display:flex;gap:6px;margin-top:10px}.imgbtns button{padding:5px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-bottom:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h3{margin:0 0 10px;font-size:13px;color:#c9d1d9}
.tier{padding:7px 0;border-bottom:1px solid var(--line)}.tier.hl{background:#3fb95010;margin:0 -8px;padding:7px 8px;border-radius:8px}
.tn{font-size:12px;margin-bottom:4px}.badge{font-size:9px;background:var(--grn);color:#04130a;padding:1px 5px;border-radius:4px;font-weight:700}
.bars{display:flex;align-items:center;gap:8px;margin:2px 0}.bl{width:30px;font-size:10px;color:var(--mut)}
.barwrap{flex:1;display:flex;align-items:center;gap:7px}.bar{height:13px;border-radius:3px;min-width:2px}.bar.amber{background:var(--amber)}.bar.green{background:var(--grn)}
.barwrap span{font-size:11px;font-variant-numeric:tabular-nums;color:#c9d1d9}
.lc{font-size:13px;padding:9px 11px;border-radius:8px;margin-top:12px}.lc.good{background:#1a3326;border:1px solid var(--grn)}.lc.bad{background:#3a1518;border:1px solid var(--red)}.lc.warn{background:#33290f;border:1px solid var(--yel)}
.impact{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin-top:12px}.impact div:nth-child(odd){color:var(--mut)}
.tc{margin-bottom:10px;border-bottom:1px solid #21262d;padding-bottom:6px}.tc:last-child{border-bottom:none}
.tch{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:2px}
svg.chart{width:100%;height:auto;display:block}.chart .grid{stroke:#30363d;stroke-width:.5}.chart .ylab{fill:#9da7b3;font-size:9px;text-anchor:end}.chart .xlab{fill:#9da7b3;font-size:9px}
.legend{font-size:11px;color:var(--mut);margin-top:4px}.lg{margin-right:10px}.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.dist{margin-top:8px}.distbar{position:relative;height:16px;background:#0d1117;border:1px solid var(--line);border-radius:8px;margin:4px 0}
.distbar .iqr{position:absolute;top:0;bottom:0;background:#3fb95044;border-radius:6px}.distbar .med{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--grn)}
.distlab{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
table.rt{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}table.rt th,table.rt td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right}table.rt th{color:var(--mut)}table.rt td:first-child,table.rt th:first-child{text-align:left}
.actions{display:flex;gap:9px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;position:sticky;bottom:0}
.b-app{background:#16331f;border-color:var(--grn);font-weight:600}.b-rej{background:#21262d}.b-hold{background:#33290f;border-color:var(--yel)}.b-map{background:#3a230f;border-color:var(--org)}
.statusline{margin-top:8px;font-size:12px}.done .imgcard,.done .box{opacity:.65}
#zoom{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}#zoom img{max-width:96vw;max-height:96vh;border-radius:8px}
a{color:#58a6ff}
</style></head><body>
<header>
  <b>🎴 SNK 가격 검수 ⑤</b>
  <span class="pill" id="prio">HIGH 하향</span>
  <span class="mut" id="prog">…</span>
  <span class="mut" id="rate"></span>
  <span style="flex:1"></span>
  <span class="mut">a 승인 · r 거절 · h 보류 · m 매핑오류 · ←→ 이동</span>
</header>
<div class="wrap"><div id="root" class="mut">로딩…</div></div>
<div id="zoom" onclick="this.style.display='none'"><img></div>
<script>
let ROWS=[],i=0;
const won=n=>(n==null||n==='')?'—':'₩'+Number(n).toLocaleString();
const tsFmt=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

async function load(){
  const r=await fetch('/api/queue?priority=HIGH&status=ALL').then(x=>x.json());
  ROWS=r.rows; document.getElementById('rate').textContent=r.rate_note;
  updateProg();
  if(!ROWS.length){document.getElementById('root').textContent='큐 비어있음 (collector+detector 먼저 실행).';return;}
  if(i>=ROWS.length)i=0; render();
}
function updateProg(){const done=ROWS.filter(x=>x.review_status!=='PENDING_REVIEW').length;
  document.getElementById('prog').textContent=`검수 ${done}/${ROWS.length} · 남음 ${ROWS.length-done}`}
function statusTag(s){const m={PENDING_REVIEW:['대기','var(--mut)'],APPROVED_REPLACE_WITH_SNK:['✓ SNK RAW 대체 승인','var(--grn)'],REJECTED_KEEP_SCRYDEX:['Scrydex 유지','var(--mut)'],HOLD:['보류(근거부족)','var(--yel)'],MAPPING_REVIEW:['매핑오류','var(--org)']};const[t,c]=m[s]||[s,'var(--mut)'];return `<span class="tag" style="color:${c};border-color:${c}">${t}</span>`}

function tierBars(c){
  const rows=[['RAW (A)',c.scrydex_raw,c.snk_A,true],['PSA9',c.scrydex_psa9,c.snk_psa9,false],['PSA10',c.scrydex_psa10,c.snk_psa10,false]];
  return rows.map(([name,scry,snk,hl])=>{
    const mx=Math.max(scry||0,snk||0)||1;
    const gap=(scry&&snk)?(scry/snk):null;
    const bar=(v,cls)=>`<div class="barwrap"><div class="bar ${cls}" style="width:${Math.round((v||0)/mx*100)}%"></div><span>${won(v)}</span></div>`;
    return `<div class="tier ${hl?'hl':''}"><div class="tn">${name}${hl?' <span class="badge">대체 대상</span>':''}${gap?` <span class="mut">scry ×${gap.toFixed(2)}</span>`:''}</div>
      <div class="bars"><div class="bl">scry</div>${bar(scry,'amber')}</div>
      <div class="bars"><div class="bl">SNK</div>${bar(snk,'green')}</div></div>`;
  }).join('');
}
function ladderCheck(c){
  const a=c.snk_A,p9=c.snk_psa9,p10=c.snk_psa10;
  if(p10&&p9&&a){const ok=(p10>p9&&p9>a);return `<div class="lc ${ok?'good':'bad'}">SNK ladder ${ok?'정상 ✓':'비정상 ✗'}<br><span class="mut">PSA10 ${won(p10)} > PSA9 ${won(p9)} > RAW ${won(a)}</span></div>`}
  if(p10&&a){const ok=p10>a;return `<div class="lc ${ok?'good':'warn'}">SNK ladder ${ok?'정상(PSA9 거래없음) ✓':'비정상 ✗'}<br><span class="mut">PSA10 ${won(p10)} > RAW ${won(a)}</span></div>`}
  return `<div class="lc warn">SNK ladder: 데이터 부족(검수 보류 권장)</div>`;
}
function impact(c){
  return `<div class="impact">
    <div>현재 적용가(JP raw)</div><div>${won(c.scrydex_raw)} <span class="mut">(scrydex)</span></div>
    <div>승인 후 적용가</div><div><b style="color:var(--grn)">${won(c.snk_A)}</b> <span class="mut">(SNK RAW ${c.snk_A_basis} · 기준 n=${c.snk_A_n}${c.snk_A_n<5?' ⚠얇음':''} · 3m ${c.snk_A_n_3m}건)</span></div>
    <div>차액 / 변동률</div><div class="down">${won(c.snk_A-c.scrydex_raw)} / ${c.change_pct>0?'+':''}${c.change_pct}%</div>
    <div>floor/cap</div><div>${c.floor_suspect==='Y'?'⚠ floor 의심(¥1000대)':'없음'}</div>
    <div>유저 자산 영향</div><div>${c.change_pct<0?'하락 ↓':'상승 ↑'}</div></div>`;
}
// tier별 차트: SNK 시계열을 forward-fill(직전값 유지, 오늘까지 수평) step 라인 + scrydex 점선.
// xmin/xmax = 3 tier 공통 도메인(오늘=as_of). 거래 없으면 마지막값이 오늘까지 일직선.
function tierChart(label,color,series,scrydexVal,n,xmin,xmax){
  const W=560,H=132,pl=62,pr=78,pt=14,pb=20;
  const pts=(series||[]).filter(p=>p[1]>0).sort((a,b)=>a[0]-b[0]);
  if(!pts.length){
    return `<div class="tc"><div class="tch"><span style="color:${color}">${label}</span><span class="mut">거래 0</span></div>
      <div class="mut" style="padding:6px 0">SNK 거래 없음 · scrydex ${won(scrydexVal)}</div></div>`;
  }
  let vals=pts.map(p=>p[1]); if(scrydexVal)vals=vals.concat([scrydexVal]);
  let ymin=Math.min(...vals),ymax=Math.max(...vals); const pd=(ymax-ymin)*0.14||ymax*0.1||1; ymin-=pd; ymax+=pd;
  if(xmax<=xmin)xmax=xmin+1;
  const X=t=>pl+(Math.max(xmin,Math.min(xmax,t))-xmin)/(xmax-xmin)*(W-pl-pr);
  const Y=v=>H-pb-(v-ymin)/(ymax-ymin)*(H-pt-pb);
  const last=pts[pts.length-1];
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  // scrydex 기준선(점선)
  if(scrydexVal){const y=Y(scrydexVal).toFixed(1);
    svg+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#d2a44a" stroke-width="1.3" stroke-dasharray="5 4"/>`;
    svg+=`<text x="${W-pr+4}" y="${(+y+3)}" class="ylab" style="fill:#d2a44a;text-anchor:start">scry ${won(scrydexVal)}</text>`;}
  // forward-fill step path: 직전값 유지 → 다음거래에 step → 마지막값 오늘까지 수평
  let dd=`M ${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
  for(let k=1;k<pts.length;k++){dd+=` L ${X(pts[k][0]).toFixed(1)} ${Y(pts[k-1][1]).toFixed(1)} L ${X(pts[k][0]).toFixed(1)} ${Y(pts[k][1]).toFixed(1)}`;}
  dd+=` L ${X(xmax).toFixed(1)} ${Y(last[1]).toFixed(1)}`;
  svg+=`<path d="${dd}" fill="none" stroke="${color}" stroke-width="1.7"/>`;
  // 실제 거래 점(채워진=실거래) + forward-fill 구간 표시
  svg+=pts.map(([t,v])=>`<circle cx="${X(t).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.4" fill="${color}"><title>실거래 ${tsFmt(t)} ${won(v)}</title></circle>`).join('');
  // 오늘 시점 끝점(빈 원=거래없이 유지)
  svg+=`<circle cx="${X(xmax).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="2.4" fill="none" stroke="${color}" stroke-width="1.3"><title>오늘(유지) ${won(last[1])}</title></circle>`;
  svg+=`<text x="${W-pr+4}" y="${(+Y(last[1]).toFixed(1)+3)}" class="ylab" style="fill:${color};text-anchor:start">SNK ${won(last[1])}</text>`;
  svg+=`<text x="${pl}" y="${H-5}" class="xlab">${tsFmt(pts[0][0])}</text>`;
  svg+=`<text x="${W-pr}" y="${H-5}" class="xlab" text-anchor="end">오늘 ${tsFmt(xmax)}</text>`;
  svg+=`</svg>`;
  const gap=(scrydexVal&&last[1])?` · scry ×${(scrydexVal/last[1]).toFixed(2)}`:'';
  const stale=(xmax-last[0])/864e5;
  const staleTxt=stale>30?` · <span class="down">최근거래 ${Math.round(stale)}일전(stale)</span>`:'';
  return `<div class="tc"><div class="tch"><span style="color:${color}">${label}</span><span class="mut">n=${n||pts.length}${gap}${staleTxt}</span></div>${svg}</div>`;
}
function recommend(c){
  const thin=c.snk_A_n<5;
  const ladderBroken=/RAW_OVER|GRADED_INVERSION/.test(c.ladder_violation||'');
  if(c.action_status==='MAPPING_REVIEW')return{v:'매핑 먼저 확인',col:'org',why:'scrydex/SNK 괴리 ×3↑ — 다른 카드 매핑 의심. 이미지부터 대조',act:'mapping_review'};
  if(c.floor_suspect==='Y')return{v:'보류 권장',col:'yel',why:'SNK 대표값이 floor(¥1000대) 의심 — 대표값 신뢰 낮음',act:'hold'};
  if(thin)return{v:'보류 권장',col:'yel',why:`결정 윈도우 거래 n=${c.snk_A_n}<5 (얇음, 3m=${c.snk_A_n_3m}). 최근 근거 약함 → 다음 수집 후 재판단`,act:'hold'};
  if(ladderBroken&&c.confidence==='STRONG_REPLACE')return{v:'✅ 강력 추천: SNK로 대체',col:'grn',why:`scrydex 자체 ladder 위배(${c.ladder_violation}) + 일본 실거래 n=${c.snk_A_n} 충분 → scrydex 명백히 과대`,act:'approve_replace'};
  if(c.confidence==='STRONG_REPLACE')return{v:'✅ 추천: SNK로 대체',col:'grn',why:`scrydex가 일본 실거래 대비 ×${c.ratio} 과대 · n=${c.snk_A_n} 충분 · SNK ladder 정상 → SNK 신뢰`,act:'approve_replace'};
  return{v:'검토 후 판단',col:'mut',why:'근거 보통 — 차트/이미지 직접 확인 권장',act:null};
}
function recBlock(c){
  const r=recommend(c),cm={grn:'var(--grn)',yel:'var(--yel)',red:'var(--red)',org:'var(--org)',mut:'var(--mut)'};
  return `<span style="font-weight:700;color:${cm[r.col]}">🧭 내 추천: ${r.v}</span> — ${r.why}<br><span class="mut">판정 ${c.priority}/${c.confidence} · ${reasonStr(c)}</span>`;
}
function ladderBadge(c){
  if(/RAW_OVER|GRADED_INVERSION/.test(c.ladder_violation||''))
    return `<span class="tag" style="color:var(--red);border-color:var(--red)">⚠ scrydex ladder 위배 (${c.ladder_violation})</span>`;
  return `<span class="tag mut">SNK 발산형 (scrydex ladder 정상)</span>`;
}
function distBar(r){
  if(!r||!r.n)return '<div class="mut">RAW 분포 데이터 없음</div>';
  const lo=r.min_krw,sp=(r.max_krw-lo)||1,pos=v=>((v-lo)/sp*100);
  return `<div class="dist"><div class="distbar">
    <div class="iqr" style="left:${pos(r.p25_krw)}%;width:${Math.max(1,pos(r.p75_krw)-pos(r.p25_krw))}%"></div>
    <div class="med" style="left:${pos(r.median_krw)}%"></div></div>
    <div class="distlab"><span>min ${won(r.min_krw)}</span><span>중앙 ${won(r.median_krw)}</span><span>max ${won(r.max_krw)}</span></div>
    <div class="mut" style="margin-top:3px">${r.window} 윈도우 · n=${r.n} · 최근거래 ${r.last_date} · IQR ${won(r.p25_krw)}~${won(r.p75_krw)}</div></div>`;
}
function recentList(r){
  if(!r||!r.recent||!r.recent.length)return '';
  return '<table class="rt"><tr><th>거래일</th><th>JPY</th><th>KRW</th></tr>'+
    r.recent.map(t=>`<tr><td>${t.date}</td><td>¥${t.jpy.toLocaleString()}</td><td>${won(t.krw)}</td></tr>`).join('')+'</table>';
}
function reasonStr(c){
  const lad=(c.snk_psa10&&c.snk_psa9&&c.snk_A)?(c.snk_psa10>c.snk_psa9&&c.snk_psa9>c.snk_A?'정상':'비정상'):(c.snk_psa10&&c.snk_A?(c.snk_psa10>c.snk_A?'정상(PSA9없음)':'비정상'):'부족');
  const thin=c.snk_A_n<5?` <b class="down">(기준 윈도우 n=${c.snk_A_n} 얇음 — 신중)</b>`:'';
  return `SNK RAW 실거래 기준 n=${c.snk_A_n}건(3m ${c.snk_A_n_3m})${thin} · Scrydex가 SNK RAW 대비 ×${c.ratio} 과대 · ladder ${lad} · 변동 ${c.change_pct}% → Scrydex RAW 과대평가 가능성 ${c.confidence==='STRONG_REPLACE'?'높음':'검토(REVIEW)'}`;
}

async function render(){
  const c=ROWS[i];
  document.getElementById('root').innerHTML=`
  <div class="nav">
    <button onclick="go(-1)">← 이전</button><span class="mut">${i+1} / ${ROWS.length}</span><button onclick="go(1)">다음 →</button>
    ${statusTag(c.review_status)} ${c.reviewed_by?`<span class="mut">· ${c.reviewed_by} ${c.reviewed_at||''}</span>`:''}
  </div>
  <div id="body" class="${c.review_status!=='PENDING_REVIEW'?'done':''}">
    <div class="banner">
      <span class="conf">${c.confidence}</span>
      <h2>${c.card_name||'(이름없음)'} <span class="mut" style="font-size:13px">${c.rarity||''} · ${c.collection_number||''}</span> ${ladderBadge(c)}</h2>
      <div class="bigprice">${won(c.scrydex_raw)} → <b class="down">${won(c.snk_A)}</b><br><span class="down">${c.change_pct>0?'+':''}${c.change_pct}% / ${won(c.snk_A-c.scrydex_raw)}</span></div>
      <div class="reason">${recBlock(c)}</div>
    </div>
    <div class="imgrow">
      <div class="imgcard"><div class="hd"><span>우리 카드</span><span>${c.card_id}</span></div>
        <div class="imgbox"><img src="${c.our_img}" onclick="zoom('${c.our_img}')" onerror="this.style.opacity=.12"></div>
        <div class="imeta"><div>카드명</div><div>${c.card_name||'—'}</div><div>세트/번호</div><div>${c.collection_number||'—'}</div><div>레어도</div><div>${c.rarity||'—'}</div></div>
      </div>
      <div class="imgcard"><div class="hd"><span>SNK (apparel ${c.apparel_id})</span><a href="${c.detail_url}" target="_blank">원문 ↗</a></div>
        <div class="imgbox"><img src="${c.snk_img}" onclick="zoom('${c.snk_img}')" onerror="this.style.opacity=.12"></div>
        <div class="imeta"><div>SNK 카드명</div><div>${c.snk_title||'—'}</div><div>product#</div><div>${c.snk_product_number||'—'}</div><div>usedMin(호가)</div><div>${won(c.used_min_krw)} <span class="mut">¥${c.used_min_jpy}·${c.used_listing}건</span></div></div>
      </div>
    </div>
    <div class="grid">
      <div class="box"><h3>① Scrydex vs SNK 가격 비교 (tier별)</h3>${tierBars(c)}${ladderCheck(c)}<h3 style="margin-top:14px">반영 영향</h3>${impact(c)}</div>
      <div class="box"><h3>② tier별 SNK 시계열 vs scrydex (점선=scrydex)</h3><div id="chart" class="mut">차트 로딩…</div>
        <h3 style="margin-top:14px">③ RAW(A) 거래 분포 + 최근 거래</h3><div id="dist" class="mut">로딩…</div><div id="recent"></div></div>
    </div>
    <div class="actions">
      <button class="b-app" onclick="decide('approve_replace')">✓ 승인: SNK RAW로 대체<span class="k">(a)</span></button>
      <button class="b-rej" onclick="decide('reject_keep')">거절: Scrydex 유지<span class="k">(r)</span></button>
      <button class="b-hold" onclick="decide('hold')">보류: 가격 근거 부족<span class="k">(h)</span></button>
      <button class="b-map" onclick="decide('mapping_review')">매핑 오류: 다른 카드<span class="k">(m)</span></button>
      <span class="statusline mut" id="msg"></span>
    </div>
  </div>`;
  // 차트 비동기 로드 (행에 캐시)
  if(!c._chart){
    try{c._chart=await fetch('/api/chart?apparel_id='+c.apparel_id).then(x=>x.json());}catch(e){c._chart={series:{},raw:{}};}
  }
  if(ROWS[i]!==c)return; // 그새 이동했으면 무시
  const s=c._chart.series||{};
  const asOf=c._chart.as_of||Date.now();
  let allTs=[];['RAW','PSA9','PSA10'].forEach(k=>(s[k]||[]).forEach(p=>{if(p[1]>0)allTs.push(p[0])}));
  const xmin=allTs.length?Math.min(...allTs):asOf-90*864e5, xmax=asOf;
  document.getElementById('chart').innerHTML=
    tierChart('RAW (A) · 대체대상','#3fb950',s.RAW,c.scrydex_raw,c.snk_A_n,xmin,xmax)+
    tierChart('PSA9','#58a6ff',s.PSA9,c.scrydex_psa9,c.snk_psa9_n,xmin,xmax)+
    tierChart('PSA10','#bc8cff',s.PSA10,c.scrydex_psa10,c.snk_psa10_n,xmin,xmax);
  document.getElementById('dist').innerHTML=distBar(c._chart.raw);
  document.getElementById('recent').innerHTML=recentList(c._chart.raw);
}
function go(d){i=Math.max(0,Math.min(ROWS.length-1,i+d));render()}
function zoom(s){if(!s)return;const z=document.getElementById('zoom');z.querySelector('img').src=s;z.style.display='flex'}
async function decide(decision){
  const c=ROWS[i];
  const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({card_id:c.card_id,run_id:c.run_id,decision,by:'operator'})}).then(x=>x.json());
  const msg=document.getElementById('msg');
  if(r.ok){c.review_status=r.status;c.reviewed_by='operator';updateProg();
    if(msg)msg.textContent='저장됨: '+r.status;
    let nx=ROWS.findIndex((x,j)=>j>i&&x.review_status==='PENDING_REVIEW');
    if(nx<0)nx=ROWS.findIndex(x=>x.review_status==='PENDING_REVIEW');
    if(nx>=0){i=nx;render()}else render();
  }else if(msg)msg.textContent='실패: '+(r.err||'');
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);
  else if(e.key==='a')decide('approve_replace');else if(e.key==='r')decide('reject_keep');
  else if(e.key==='h')decide('hold');else if(e.key==='m')decide('mapping_review');
});
load();
</script></body></html>
