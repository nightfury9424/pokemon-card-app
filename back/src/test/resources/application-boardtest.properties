# 게시판 읽기 테스트 — 격리 Postgres. 환경변수 기본값으로 PC/CI 종속 제거.
# (Docker 가능 시 Testcontainers 가 이상적이나, 현재 오프라인이라 의존성 미추가 → 환경변수 + 실제 마이그 자동적용.)
# 사전 조건: 빈 DB 1개만 있으면 됨(없으면 createdb). 스키마는 아래 실제 마이그 SQL이 부팅 시 자동 생성.
spring.datasource.url=${BOARD_TEST_DB_URL:jdbc:postgresql://localhost:5432/board_test}
spring.datasource.username=${BOARD_TEST_DB_USER:nightfury}
spring.datasource.password=${BOARD_TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 운영과 동일하게 validate — 엔티티↔실제 테이블 불일치를 부팅 시 검증(스크립트 선행 적용 후).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.flyway.enabled=false

# 스키마 = 실제 마이그레이션 SQL 그대로(blocks 도 실제 마이그). IF NOT EXISTS 멱등.
# Spring Boot 가 JPA EMF 를 스크립트 초기화에 의존시켜 validate 전에 실행. 기존 DB 재사용 시
# "already exists"는 무해 → continue-on-error 로 관용(실오류는 validate 가 잡음).
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=file:sql/blocks_migration.sql,file:sql/board_read_migration.sql,file:sql/board_write_constraints_migration.sql,file:sql/board_post_likes_migration.sql
