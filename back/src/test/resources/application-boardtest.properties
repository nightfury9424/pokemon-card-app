# 게시판 읽기 테스트 전용 — 격리 DB board_test(로컬 Postgres). dev DB(pokemon_card_db) 미오염.
# 스키마는 board_read_migration.sql + blocks_migration.sql 로 사전 적용(ddl-auto=none).
spring.datasource.url=jdbc:postgresql://localhost:5432/board_test
spring.datasource.username=nightfury
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=false
# 스키마는 마이그 SQL로 사전 적용 → 부트 시 schema.sql/data.sql 자동 실행 금지.
spring.sql.init.mode=never
