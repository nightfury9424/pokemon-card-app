# 전체 컨텍스트 부팅 검증 전용(배포 동등 격리). 더미 config + 엔티티 생성 스키마(create-drop).
# 목적: board 추가분 + 기존 빈 전체가 정상 부팅(wiring)되는지 증명. 외부 호출은 하지 않음(부팅만).
spring.datasource.url=${CI_DB_URL:jdbc:postgresql://localhost:5432/pokefolio_ci}
spring.datasource.username=${CI_DB_USER:nightfury}
spring.datasource.password=${CI_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# ── 더미 배포 config(부팅용, 실제 시크릿 아님) ──
google.client-id=ci-test.apps.googleusercontent.com
jwt.secret=ci-test-secret-0123456789-0123456789-0123456789-0123456789-abcd
jwt.expiration-ms=3600000
aws.access-key=ci-test
aws.secret-key=ci-test
aws.s3.bucket=ci-test-bucket
aws.s3.region=ap-northeast-2
app.card-cdn.base-url=https://ci.example.test/cards/v1
app.cors.allowed-origins=http://localhost
app.image-storage.local.base-dir=/tmp/pf_ci_images
app.python.scripts-dir=/tmp
app.python.system=/usr/bin/python3
app.python.venv-kream=/tmp
card.image.dir=/tmp
trade.image.dir=/tmp
grading.service.url=http://localhost:8081
